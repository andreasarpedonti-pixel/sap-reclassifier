        </div>
      </div>
        ${!allP.length
        ?`<div class="alert warn" style="margin-top:10px">⚠ Nessun bilancio caricato per questo ledger. Vai su "Importa dati".</div>`
        :`<div class="print-header" style="margin-bottom:12px">
        <h2>Serom Medical Technology s.r.l.</h2>
        <p id="print-subtitle">Bilancio riclassificato</p>
        <hr>
      </div>
      <div id="rpt-scroll"><table class="rpt-tbl" id="rpt-tbl"></table></div>`}
    </div>`;
  rRptTable();
}

function setView(v)    { rptView=v; rptPeriods=[]; rReport(); } // reset periodi al cambio view
function setMode(m)    { rptMode=m;    rUpdControls(); rRptTable(); }
function toggleExpand(){ rptExpand=!rptExpand; rUpdControls(); rRptTable(); }
function toggleGroupQ(){ rptGroupQ=!rptGroupQ; rUpdControls(); rRptTable(); }
function selAllP()   { const {bils}=rptParams(); rptPeriods=[...bils.map(b=>b.period)]; rUpdControls(); rRptTable(); }
function deselAllP() { const {bils}=rptParams(); const all=bils.map(b=>b.period); rptPeriods=all.length?[all[all.length-1]]:rptPeriods; rUpdControls(); rRptTable(); }

function togglePeriod(p) {
  if(rptPeriods.includes(p)) { if(rptPeriods.length===1) return; rptPeriods=rptPeriods.filter(x=>x!==p); }
  else rptPeriods=[...rptPeriods,p].sort();
  rUpdControls();
  rRptTable();
}

// Aggiorna solo i colori dei pulsanti senza ricostruire la pagina
function rUpdControls() {
  const {bils} = rptParams();
  const allP=bils.map(b=>b.period);
  document.querySelectorAll('#rpt-controls button').forEach(b=>{
    const t=b.textContent.trim();
    let active=false;
    if(t.includes('IFRS Locale'))   active=rptView==='ifrs-locale';
    else if(t.includes('IFRS Corp'))  active=rptView==='ifrs-corp';
    else if(t.includes('Civ Locale')) active=rptView==='civ-locale';
    else if(t.includes('VI Direttiva')) active=rptView==='civ-dir6';
    else if(t==='YTD')   active=rptMode==='ytd';
    else if(t==='PTD')   active=rptMode==='ptd';
    else if(t==='≡ Conti') active=rptExpand;
    else if(t==='📅 Quarter') active=rptGroupQ;
    else if(allP.includes(b.textContent.trim())) active=rptPeriods.includes(b.textContent.trim());
    else return;
    b.className='btn btn-sm '+(active?'btn-on':'btn-off');
  });
}

// Collasso: nasconde/mostra ricorsivamente tutti i discendenti DOM
function toggleCollapse(nodeId) {
  if(rptCollapsed.has(nodeId)) rptCollapsed.delete(nodeId);
  else rptCollapsed.add(nodeId);
  applyCollapse();
}

function applyCollapse() {
  // Calcola quali righe devono essere nascoste (un antenato è collassato)
  const tbl=document.getElementById('rpt-tbl'); if(!tbl) return;
  tbl.querySelectorAll('tr[data-nid],tr[data-acc]').forEach(tr=>{
    // Risali la catena dei data-parent
    let cur=tr.dataset.par||'';
    let hidden=false;
    while(cur) {
      if(rptCollapsed.has(cur)){hidden=true;break;}
      const parent=tbl.querySelector(`tr[data-nid="${CSS.escape(cur)}"]`);
      cur=parent?.dataset.par||'';
    }
    tr.classList.toggle('r-hidden',hidden);
  });
  // Aggiorna triangoli
  tbl.querySelectorAll('[data-tog]').forEach(el=>{
    el.textContent=rptCollapsed.has(el.dataset.tog)?'▶':'▼';
  });
}

function initColResize(tbl) {
  const ths = Array.from(tbl.querySelectorAll('thead tr:first-child th'));
  ths.forEach((th, idx) => {
    if (idx === ths.length - 1) return; // salta colonna semaforo sticky-right
    // position:relative per il handle (non sovrascrive sticky dei primi 2)
    if (!th.style.position || th.style.position === '') th.style.position = 'relative';
    const handle = document.createElement('div');
    handle.className = 'col-rh';
    let startX, startW;
    handle.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation();
      handle.classList.add('dragging');
      startX = e.pageX;
      startW = th.getBoundingClientRect().width;
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      const onMove = e2 => {
        const w = Math.max(50, startW + (e2.pageX - startX));
        th.style.minWidth = w + 'px';
        th.style.width    = w + 'px';
      };
      const onUp = () => {
        handle.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
    th.appendChild(handle);
  });
}

function rRptTable() {
  const _scr = document.getElementById('rpt-scroll');
  const _scrollTop  = _scr ? _scr.scrollTop  : 0;
  const _scrollLeft = _scr ? _scr.scrollLeft : 0;
  const {struct, mapKey, bils} = rptParams();
  const selBils = bils.filter(b=>rptPeriods.includes(b.period));
  // Ultimo periodo per semaforo riconciliazione (usa bilanci del view attivo)
  const _lastP = bils.length ? bils[bils.length-1].period : null;
  function _reconLight(nid) {
    const dotStyle = (bg, shadow, title, onclick) =>
      `<span ${onclick?`onclick="${onclick}"`:''} title="${title}"
        style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${bg};flex-shrink:0;
               ${shadow?`box-shadow:0 0 0 2px ${shadow};`:'border:1.5px solid #d1d5db;'}
               cursor:${onclick?'pointer':'default'};vertical-align:middle"></span>`;
    if (!_lastP) return dotStyle('transparent','','','');
    const key = nid+'::'+_lastP;
    const voci = S.recon[key];
    if (!voci || !voci.length) return dotStyle('#e5e7eb','','Nessuna riconciliazione','');
    const bilLast = bils.find(b=>b.period===_lastP);
    const saldo = bilLast ? getBalanceYTD(bilLast, nid) : 0;
    const tot = voci.reduce((s,v)=>s+(v.segno==='+'?1:-1)*(v.importo||0), 0);
    const inQ = Math.abs(saldo - tot) < 0.005;
    const title = inQ ? 'In quadratura' : `Non quadra — Scarto: ${fmt(saldo-tot)}`;
    return dotStyle(inQ?'#16a34a':'#dc2626', inQ?'rgba(22,163,74,.25)':'rgba(220,38,38,.25)', title, `event.stopPropagation();goRecon('${esc(nid)}')`);
  }
  const tbl = document.getElementById('rpt-tbl');

  // Quarter fiscale: Q1=Apr-Giu, Q2=Lug-Set, Q3=Ott-Dic, Q4=Gen-Mar
  // Restituisce {fy, q} per un period string 'YYYY-MM-...' 
  function bilQuarter(period) {
    const [y,m] = periodYM(period).split('-').map(Number);
    const fy = m>=4?y:y-1;
    const mOff = m>=4?m-4:m+8; // 0=apr,1=mag,...,11=mar
    const q = Math.floor(mOff/3)+1; // 1..4
    return {fy, q};
  }
  function qLabel(fy,q){
    const ends={1:'Giu',2:'Set',3:'Dic',4:'Mar'};
    const endY=q===4?fy+1:fy;
    return `Q${q} ${fy}/${String(fy+1).slice(2)} (al ${ends[q]} ${endY})`;
  }

  // Colonne effettive: mesi singoli o quarters aggregati
  // Ogni colonna ha {label, bils:[...bilanci], isQ:bool}
  const cols = (() => {
    if(!rptGroupQ) return selBils.map(b=>({label:b.period, bils:[b], isQ:false}));
    // Raggruppa per (fy,q), mantieni ordine cronologico
    const groups=new Map();
    selBils.forEach(b=>{
      const {fy,q}=bilQuarter(b.period);
      const k=`${fy}-Q${q}`;
      if(!groups.has(k)) groups.set(k,{fy,q,bils:[]});
      groups.get(k).bils.push(b);
    });
    return [...groups.values()].map(({fy,q,bils})=>({label:qLabel(fy,q), bils, isQ:true}));
  })();

  // colVal: valore di una colonna per un conto/nodo
  // YTD quarter = saldo dell'ultimo mese del quarter disponibile
  // PTD quarter = somma dei PTD mensili del quarter
  const _riclass = rptView.includes('civ') ? (S.riclassCiv||[]) : (S.riclassIFRS||[]);
  function _withAdj(bil, mode, fn) {
    _currentRiclassAdj = calcRiclassAdj(struct, S.mapping, mapKey, bil, mode, _riclass);
    const r = fn();
    _currentRiclassAdj = null;
    return r;
  }
  function colNodeTotal(col, nodeId) {
    if(!col.isQ || rptMode==='ptd') {
      return col.bils.reduce((s,b)=>s+_withAdj(b,rptMode,()=>nodeTotal(struct,S.mapping,mapKey,b,nodeId,rptMode)),0);
    }
    const last=col.bils[col.bils.length-1];
    return _withAdj(last,'ytd',()=>nodeTotal(struct,S.mapping,mapKey,last,nodeId,'ytd'));
  }
  function colBalance(col, accountId) {
    if(!col.isQ || rptMode==='ptd') {
      return col.bils.reduce((s,b)=>s+getBalance(b,accountId,rptMode),0);
    }
    const last=col.bils[col.bils.length-1];
    return getBalanceYTD(last,accountId);
  }
  // Delta apportato da una singola regola di riclassifica su una colonna
  function colRuleAmount(col, rule) {
    function amt(bil, mode) {
      if (rule.active === false) return 0;
      if (rule.period && rule.period !== bil.period) return 0;
      if (rule.type === 'account') {
        const a = S.coa.find(x=>x.id===rule.source); if (!a) return 0;
        const bal = getBalance(bil, a.id, mode); if (bal === 0) return 0;
        return (rule.amount != null && rule.amount > 0) ? Math.sign(bal)*Math.abs(rule.amount) : bal;
      } else {
        const srcNode = resolveNode(struct, rule.source); if (!srcNode) return 0;
        const saved = _currentRiclassAdj; _currentRiclassAdj = null;
        const tot = nodeTotal(struct, S.mapping, mapKey, bil, srcNode, mode);
        _currentRiclassAdj = saved; if (tot === 0) return 0;
        return (rule.amount != null && rule.amount > 0) ? Math.sign(tot)*Math.abs(rule.amount) : tot;
      }
    }
    if (!col.isQ || rptMode==='ptd') return col.bils.reduce((s,b)=>s+amt(b,rptMode),0);
    return amt(col.bils[col.bils.length-1],'ytd');
  }
  if (!tbl) return;

  if (!struct.length) {
    const {label} = rptParams();
    tbl.innerHTML=`<tr><td colspan="99" style="padding:28px;text-align:center;color:#a8a29e">
      Struttura per "${label}" non caricata — vai su Strutture.</td></tr>`;
    rRptKPI(struct,mapKey,selBils); return;
  }
  if (!selBils.length) {
    tbl.innerHTML=`<tr><td colspan="99" style="padding:28px;text-align:center;color:#a8a29e">Nessun periodo selezionato.</td></tr>`;
    rRptKPI(struct,mapKey,selBils); return;
  }

  const ncols=2+cols.length;
  function colHdr(col){
    if(col.isQ) {
      const modeL=rptMode==='ytd'?'YTD':'PTD somma';
      return `${esc(col.label)}<br><span style="font-weight:400;font-size:9px;opacity:.45">${modeL}</span>`;
    }
    const b=col.bils[0];
    if(rptMode==='ytd') return `${esc(b.period)}<br><span style="font-weight:400;font-size:9px;opacity:.45">YTD · AF ${esc(fiscalYearStart(b.period))}</span>`;
    const pv=prevBilancio(b);
    return `${esc(b.period)}<br><span style="font-weight:400;font-size:9px;opacity:.45">PTD vs ${pv?esc(periodYM(pv.period)):'ini AF'}</span>`;
  }
  const thead=`<thead><tr>
    <th style="text-align:left;min-width:100px;position:sticky;left:0;z-index:3;background:#f8fafc">Codice</th>
    <th style="text-align:left;min-width:180px;position:sticky;left:100px;z-index:3;background:#f8fafc">Voce</th>
    ${cols.map(c=>`<th style="min-width:120px">${colHdr(c)}</th>`).join('')}
    <th style="min-width:150px;text-align:left;color:#64748b;font-size:10px">Note / ⚖</th>
    <th style="width:32px;min-width:32px;padding:4px 8px;color:#64748b;font-size:9px" title="Stato riconciliazione">⚖</th>
  </tr></thead>`;

  const rows=[];

  function addNode(node, parentId) {
    const ch    = kids(struct,node.id);
    const lv    = depth(struct,node.id);
    const cls   = lv===0?'r-sec':lv===1?'r-grp':'r-nod';
    const pad   = lv*14+6;
    const bals  = cols.map(c=>colNodeTotal(c,node.id));
    const kD=mapKey==='civ'?'civD':'corpD', kC=mapKey==='civ'?'civC':'corpC';
    const hasKids= ch.length>0 || (rptExpand && S.coa.some(a=>{
      const m2=S.mapping[a.id]; if(!m2) return false;
      return resolveNode(struct,m2[kD])===node.id||resolveNode(struct,m2[kC])===node.id;
    }));
    const isColl = rptCollapsed.has(node.id);
    const tog   = hasKids
      ? `<span data-tog="${esc(node.id)}" onclick="event.stopPropagation();toggleCollapse('${esc(node.id)}')"
           style="display:inline-block;width:12px;font-size:9px;cursor:pointer;opacity:.6;flex-shrink:0">${isColl?'▶':'▼'}</span>`
      : `<span style="display:inline-block;width:12px"></span>`;
    const hidden = parentId && isAncestorCollapsed(parentId);

    // Stile cella per livello
    const codeColor = lv===0?'#3b82f6':lv===1?'#64748b':'#94a3b8';
    const codeSz    = lv===0?'12':lv===1?'11':'11';
    const valSz     = lv===0?'16':lv===1?'14':'13';
    const valFw     = lv===0?'800':lv===1?'600':'500';
    // Nodi con formula pura divisione → valori in percentuale
    const isPct = node.formula && /^\s*=?\s*[^+\-]+\/[^+\-]+\s*$/.test(node.formula);
    const fmtBal = isPct ? v => v!==0 ? (v*100).toFixed(1).replace('.',',')+'%' : '—' : v => v!==0 ? fmt(v) : '—';
    const nodeRow = `<tr class="${cls}${hidden?' r-hidden':''}" data-nid="${esc(node.id)}" data-par="${esc(parentId||'')}"
        onclick="toggleCollapse('${esc(node.id)}')" style="cursor:${hasKids?'pointer':'default'}">
      <td style="padding-left:${pad}px;position:sticky;left:0;z-index:1;background:var(--row-bg,#fff)">
        <span style="display:inline-flex;align-items:center;gap:3px">
          ${tog}<span style="font-family:monospace;font-size:${codeSz}px;color:${codeColor}">${esc(node.id.length>20?node.id.slice(0,18)+'…':node.id)}</span>
        </span>
      </td>
      <td style="position:sticky;left:100px;z-index:1;background:var(--row-bg,#fff)">${esc(node.name)}</td>
      ${bals.map(v=>`<td class="${isPct?'':cn(v)}" style="font-family:monospace;font-size:${valSz}px;font-weight:${valFw}">${fmtBal(v)}</td>`).join('')}
      <td></td>
      <td></td>
    </tr>`;

    // Conti diretti (se espanso)
    const accRowsHtml = [];
    if(rptExpand) {
      S.coa.forEach(a=>{
        const m2=S.mapping[a.id]; if(!m2) return;
        const kD=mapKey==='civ'?'civD':'corpD', kC=mapKey==='civ'?'civC':'corpC';
        const r1=resolveNode(struct,m2[kD]), r2=resolveNode(struct,m2[kC]);
        if(r1!==node.id && r2!==node.id) return;
        const aBals=cols.map(c=>colBalance(c,a.id));
        if(!aBals.some(v=>v!==0)) return;
        const hAcc = isColl || hidden;
        accRowsHtml.push(`<tr class="r-acc${hAcc?' r-hidden':''}" data-acc="1" data-par="${esc(node.id)}">
          <td style="padding-left:${pad+22}px;font-family:monospace;font-size:12px;color:#94a3b8;position:sticky;left:0;z-index:1;background:var(--row-bg,#fff)">${esc(a.id)}</td>
          <td style="font-size:12px;color:#64748b;position:sticky;left:100px;z-index:1;background:var(--row-bg,#fff)">${esc(a.name)}</td>
          ${aBals.map(v=>`<td class="${cn(v)}" style="font-family:monospace;font-size:12px">${v!==0?fmt(v):'—'}</td>`).join('')}
          <td style="padding:2px 6px;white-space:nowrap" onclick="event.stopPropagation()">
            <span style="display:inline-flex;align-items:center;gap:4px">
              <input type="text" value="${esc(S.notes[a.id]||'')}"
                oninput="S.notes['${esc(a.id)}']=this.value;save()"
                placeholder="nota…"
                style="width:110px;font-size:10px;padding:2px 5px;border:1px solid #e2e8f0;border-radius:4px;background:transparent;color:#334155"
                onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#e2e8f0'">
              <button title="Riconciliazione" onclick="event.stopPropagation();goRecon('${esc(a.id)}')"
                style="background:none;border:none;cursor:pointer;font-size:13px;color:#bfdbfe;padding:1px 4px;border-radius:3px"
                onmouseenter="this.style.color='#3b82f6';this.style.background='#eff6ff'"
                onmouseleave="this.style.color='#bfdbfe';this.style.background='none'">⚖</button>
            </span>
          </td>
          <td onclick="event.stopPropagation()">${_reconLight(a.id)}</td>
        </tr>`);
      });
    }

    // Helper per cella note+riconciliazione (riusato per entrata e uscita)
    // Returns TWO <td> strings: [noteCell, semaforoCell]
    function rcNoteCell(noteKey, reconId) {
      const reconBtn = reconId
        ? `<button title="Riconciliazione" onclick="event.stopPropagation();goRecon('${esc(reconId)}')"
             style="background:none;border:none;cursor:pointer;font-size:13px;color:#bbb;padding:1px 4px;border-radius:3px"
             onmouseenter="this.style.color='#3b82f6';this.style.background='#eff6ff'"
             onmouseleave="this.style.color='#bbb';this.style.background='none'">⚖</button>`
        : '';
      const noteCell = `<td style="padding:2px 6px;white-space:nowrap" onclick="event.stopPropagation()">
        <span style="display:inline-flex;align-items:center;gap:4px">
          <input type="text" value="${esc(S.notes[noteKey]||'')}"
            oninput="S.notes['${esc(noteKey)}']=this.value;save()"
            placeholder="nota…"
            style="width:110px;font-size:10px;padding:2px 5px;border:1px solid #e2e8f0;border-radius:4px;background:transparent;color:#334155"
            onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#e2e8f0'">
          ${reconBtn}
        </span>
      </td>`;
      const semaforoCell = `<td onclick="event.stopPropagation()">${reconId ? _reconLight(reconId) : ''}</td>`;
      return noteCell + semaforoCell;
    }

    // Righe visive delle riclassifiche in entrata (destinazione = questo nodo)
    const riclassRows = [];
    for (const r of _riclass) {
      if (r.active === false) continue;
      if (resolveNode(struct, r.target) !== node.id) continue;
      const rAmts = cols.map(c=>colRuleAmount(c,r));
      if (!rAmts.some(v=>v!==0)) continue;
      const hR = isColl || hidden;
      const noteKey = '__rc__' + (r.id || (r.source+'_'+r.target+'_'+(r.period||'')));
      riclassRows.push(`<tr class="r-riclass${hR?' r-hidden':''}" data-acc="1" data-par="${esc(node.id)}">
        <td style="padding-left:${pad+22}px;position:sticky;left:0;z-index:1;background:var(--row-bg,#fafff5)">
          <span style="font-size:10px;color:#aaa;margin-right:3px">${r.type==='account'?'📋':'🌿'}</span>
          <span style="font-family:monospace;font-size:10px;color:#888">${esc(r.source)}</span>
        </td>
        <td style="font-size:11px;color:#555;font-style:italic;position:sticky;left:100px;z-index:1;background:var(--row-bg,#fafff5)">
          ↷ ${esc(r.sourceName||r.source)}${r.note?` <span style="color:#bbb;font-size:10px">(${esc(r.note)})</span>`:''}
        </td>
        ${rAmts.map(v=>`<td class="${cn(v)}" style="font-family:monospace;font-size:11px;font-style:italic">${v!==0?fmt(v):'—'}</td>`).join('')}
        ${rcNoteCell(noteKey, r.type==='account'?r.source:null)}
      </tr>`);
    }

    // Righe visive delle riclassifiche in uscita (sorgente = questo nodo)
    const riclassOutRows = [];
    for (const r of _riclass) {
      if (r.active === false) continue;
      // Determina se questo nodo è il nodo sorgente della regola
      let isSrc = false;
      if (r.type === 'node') {
        isSrc = resolveNode(struct, r.source) === node.id;
      } else {
        const m = S.mapping[r.source];
        if (m) {
          const sd = resolveNode(struct, m[kD]), sc = resolveNode(struct, m[kC]);
          isSrc = sd === node.id || sc === node.id;
        }
      }
      if (!isSrc) continue;
      const rAmts = cols.map(c=>colRuleAmount(c,r));
      if (!rAmts.some(v=>v!==0)) continue;
      const hR = isColl || hidden;
      const noteKey = '__rc_src__' + (r.id || (r.source+'_'+r.target+'_'+(r.period||'')));
      const dstName = r.targetName || r.target;
      riclassOutRows.push(`<tr class="r-riclass-out${hR?' r-hidden':''}" data-acc="1" data-par="${esc(node.id)}">
        <td style="padding-left:${pad+22}px;position:sticky;left:0;z-index:1;background:var(--row-bg,#fff9f5)">
          <span style="font-size:10px;color:#f59e0b;margin-right:3px">↗</span>
          <span style="font-family:monospace;font-size:10px;color:#888">${esc(r.source)}</span>
        </td>
        <td style="font-size:11px;color:#888;font-style:italic;position:sticky;left:100px;z-index:1;background:var(--row-bg,#fff9f5)">
          → ${esc(dstName)}${r.note?` <span style="color:#bbb;font-size:10px">(${esc(r.note)})</span>`:''}
        </td>
        ${rAmts.map(v=>`<td class="${cn(-v)}" style="font-family:monospace;font-size:11px;font-style:italic">${v!==0?fmt(-v):'—'}</td>`).join('')}
        ${rcNoteCell(noteKey, r.type==='account'?r.source:null)}
      </tr>`);
    }

    if(node.totEnd) {
      ch.forEach(c=>addNode(c,node.id));
      rows.push(nodeRow);
      accRowsHtml.forEach(r=>rows.push(r));
      riclassOutRows.forEach(r=>rows.push(r));
      riclassRows.forEach(r=>rows.push(r));
    } else {
      rows.push(nodeRow);
      accRowsHtml.forEach(r=>rows.push(r));
      riclassOutRows.forEach(r=>rows.push(r));
      riclassRows.forEach(r=>rows.push(r));
      ch.forEach(c=>addNode(c,node.id));
    }
  }

  function isAncestorCollapsed(pid) {
    let cur=pid;
    while(cur) {
      if(rptCollapsed.has(cur)) return true;
      const p=struct.find(n=>n.id===cur);
      cur=p?.parentId||'';
    }
    return false;
  }

  struct.filter(n=>!n.parentId).forEach(n=>addNode(n,null));

  // Conti non mappati con saldo
  const unm=S.coa.filter(a=>{
    const m2=S.mapping[a.id]; if(!m2) return true;
    const kD2=mapKey==='civ'?'civD':'corpD', kC2=mapKey==='civ'?'civC':'corpC';
    return !resolveNode(struct,m2[kD2])&&!resolveNode(struct,m2[kC2]);
  });
  const unmBal=unm.filter(a=>cols.some(c=>colBalance(c,a.id)!==0));
  if(unmBal.length){
    const tots=cols.map(c=>unmBal.reduce((s,a)=>s+colBalance(c,a.id),0));
    const uc=rptCollapsed.has('__um__');
    rows.push(`<tr class="r-sec" data-nid="__um__" data-par="" onclick="toggleCollapse('__um__')" style="cursor:pointer;background:#fef2f2">
      <td colspan="2" style="padding:4px 8px;color:#991b1b">
        <span style="display:inline-flex;align-items:center;gap:4px">
          <span data-tog="__um__" style="font-size:9px;width:12px">${uc?'▶':'▼'}</span>
          <span style="font-size:11px;font-weight:600">⚠ Non mappati (${unmBal.length})</span>
        </span>
      </td>
      ${tots.map(v=>`<td class="neg" style="font-family:monospace;font-weight:700">${fmt(v)}</td>`).join('')}
      <td style="background:#fef2f2"></td>
      <td style="background:#fef2f2"></td>
    </tr>`);
    unmBal.forEach(a=>{
      const aBals=cols.map(c=>colBalance(c,a.id));
      rows.push(`<tr class="r-acc${uc?' r-hidden':''}" data-acc="1" data-par="__um__" style="background:#fff5f5">
        <td style="padding-left:20px;font-family:monospace;font-size:9px;color:#dc2626">${esc(a.id)}</td>
        <td style="font-size:10px;color:#991b1b">${esc(a.name)}</td>
        ${aBals.map(v=>`<td class="neg" style="font-family:monospace;font-size:10px">${v!==0?fmt(v):'—'}</td>`).join('')}
      <td></td><td></td>
      </tr>`);
    });
  }

  // ── Totali SP, CE, Quadratura ──────────────────────────
  function nodeTotCols(nodeHints) {
    const n = nodeHints.reduce((found, hint) => {
      if (found) return found;
      return struct.find(nd=>nd.id===hint||nd.id.startsWith(hint+' ')||nd.id.startsWith(hint+'-'));
    }, null);
    if (!n) return null;
    return cols.map(col => {
      const bils = col.bils;
      if (!col.isQ || rptMode==='ptd') {
        return bils.reduce((s,b)=>s+nodeTotal(struct,S.mapping,mapKey,b,n.id,rptMode),0);
      }
      const last = bils[bils.length-1];
      return nodeTotal(struct,S.mapping,mapKey,last,n.id,rptMode);
    });
  }

  const totA = nodeTotCols(['A']);
  const totB = nodeTotCols(['B']);
  const totC = nodeTotCols(['C']);
  const totD = nodeTotCols(['D']);
  const totE = nodeTotCols(['E']);

  // Totale SP = A+B+C (solo se almeno uno trovato)
  const hasSP = totA||totB||totC;
  const hasCE = totD||totE;
  if (hasSP) {
    const spTot = cols.map((_,i)=>(totA?totA[i]:0)+(totB?totB[i]:0)+(totC?totC[i]:0));
    rows.push(`<tr style="background:#f0fdf4;font-weight:700">
      <td colspan="2" style="padding-left:14px;position:sticky;left:0;z-index:1;background:#f0fdf4;border-top:2px solid #86efac;border-bottom:1px solid #bbf7d0">
        <span style="opacity:.5;font-size:9px;margin-right:6px;font-family:monospace">=</span>
        Totale Stato Patrimoniale (A+B+C)
      </td>
      ${spTot.map(v=>`<td class="${cn(v)}" style="font-family:monospace;font-size:13px;font-weight:700;border-top:2px solid #86efac;border-bottom:1px solid #bbf7d0">${fmt(v)}</td>`).join('')}
      <td style="border-top:2px solid #86efac;background:#f0fdf4"></td>
      <td style="border-top:2px solid #86efac;background:#f0fdf4"></td>
    </tr>`);
  }
  if (hasCE) {
    const ceTot = cols.map((_,i)=>(totD?totD[i]:0)+(totE?totE[i]:0));
    rows.push(`<tr style="background:#eff6ff;font-weight:700">
      <td colspan="2" style="padding-left:14px;position:sticky;left:0;z-index:1;background:#eff6ff;border-top:2px solid #93c5fd;border-bottom:1px solid #bfdbfe">
        <span style="opacity:.5;font-size:9px;margin-right:6px;font-family:monospace">=</span>
        Totale Conto Economico (D+E)
      </td>
      ${ceTot.map(v=>`<td class="${cn(v)}" style="font-family:monospace;font-size:13px;font-weight:700;border-top:2px solid #93c5fd;border-bottom:1px solid #bfdbfe">${fmt(v)}</td>`).join('')}
      <td style="border-top:2px solid #93c5fd;background:#eff6ff"></td>
      <td style="border-top:2px solid #93c5fd;background:#eff6ff"></td>
    </tr>`);
    if (hasSP) {
      const spTot = cols.map((_,i)=>(totA?totA[i]:0)+(totB?totB[i]:0)+(totC?totC[i]:0));
      const quadTot = cols.map((_,i)=>spTot[i]+ceTot[i]);
      rows.push(`<tr style="background:#fefce8;font-weight:800">
        <td colspan="2" style="padding-left:14px;position:sticky;left:0;z-index:1;background:#fefce8;border-top:2px solid #fde047;border-bottom:2px solid #fde047">
          <span style="opacity:.5;font-size:9px;margin-right:6px;font-family:monospace">=</span>
          Totale a quadratura (SP+CE)
        </td>
        ${quadTot.map(v=>`<td class="${cn(v)}" style="font-family:monospace;font-size:14px;font-weight:800;border-top:2px solid #fde047;border-bottom:2px solid #fde047">${fmt(v)}</td>`).join('')}
        <td style="border-top:2px solid #fde047;background:#fefce8"></td>
        <td style="border-top:2px solid #fde047;background:#fefce8"></td>
      </tr>`);
    }
  }

  tbl.innerHTML=thead+`<tbody>${rows.join('')}</tbody>`;
  initColResize(tbl);
  requestAnimationFrame(()=>{if(_scr){_scr.scrollTop=_scrollTop;_scr.scrollLeft=_scrollLeft;}});
  rRptKPI(struct,mapKey,selBils);
}

// KPI: Magazzino, Cassa netta (senza 1603), Fatturato (solo 4001), Marketing (5202)
function rRptKPI(struct, mapKey, selBils) {
  // KPI spostati in Dashboard
  return;

  function fn(...hints) { // findNode
    for(const h of hints){
      const lo=h.toLowerCase();
      let n=struct.find(n=>n.id.toLowerCase()===lo||n.id.toLowerCase().startsWith(lo+' -')||n.id.toLowerCase().startsWith(lo+' '));
      if(n) return n;
      n=struct.find(n=>n.id.toLowerCase().includes(lo)||n.name.toLowerCase().includes(lo));
      if(n) return n;
    }
    return null;
  }

  function cassaTot(b) {
    const nd=fn("16 - disponibilit","disponibilit"); if(!nd) return null;
    const ex=fn('1603'); const exIds=ex?new Set([ex.id,...descendants(struct,ex.id)]):new Set();
    const scope=new Set([nd.id,...descendants(struct,nd.id)].filter(x=>!exIds.has(x)));
    const kD3=mapKey==='civ'?'civD':'corpD', kC3=mapKey==='civ'?'civC':'corpC';
    return S.coa.reduce((s,a)=>{
      const bal=getBalance(b,a.id,rptMode);
      const raw=bal>=0?(S.mapping[a.id]?.[kD3]||S.mapping[a.id]?.[kC3]):(S.mapping[a.id]?.[kC3]||S.mapping[a.id]?.[kD3]);
      const t=resolveNode(struct,raw);
      return (t&&scope.has(t))?s+bal:s;
    },0);
  }

  const defs=[
    {ic:'🏭',label:'Magazzino',   f:(b)=>{ const n=fn('1201','magazzino'); return n?nodeTotal(struct,S.mapping,mapKey,b,n.id,rptMode):null; }},
    {ic:'💵',label:'Cassa netta', f:cassaTot, note:'escluso nodo 1603'},
    {ic:'📈',label:'Fatturato',   f:(b)=>{ const n=fn('4001'); return n?nodeTotal(struct,S.mapping,mapKey,b,n.id,rptMode):null; }, note:'nodo 4001'},
    {ic:'📣',label:'Marketing',   f:(b)=>{ const n=fn('5202'); return n?nodeTotal(struct,S.mapping,mapKey,b,n.id,rptMode):null; }, note:'nodo 5202'},
  ];

  const kpis=defs.map(d=>{
    const vals=selBils.map(b=>d.f(b));
    if(vals.every(v=>v===null)) return null;
    return {...d, vals:vals.map(v=>v??0)};
  }).filter(Boolean);

  if(!kpis.length){el.innerHTML='';return;}

  el.innerHTML=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">
    ${kpis.map(k=>`<div style="flex:1;min-width:130px;background:#fff;border:1px solid #e7e5e4;border-radius:9px;padding:8px 11px">
      <p style="font-size:11px;font-weight:600">${k.ic} ${k.label}${k.note?` <span style="font-size:9px;color:#a8a29e;font-weight:400">${esc(k.note)}</span>`:''}</p>
      ${k.vals.map((v,i)=>`<div style="display:flex;justify-content:space-between;font-size:11px;margin-top:3px">
        <span style="color:#78716c;font-size:10px">${esc(selBils[i].period)}</span>
        <span class="${cn(v)}" style="font-family:monospace;font-weight:700">${fmt(v)}</span>
      </div>`).join('')}
    </div>`).join('')}
  </div>`;
}

// XLSX REPORT EXPORT (zero dipendenze — ZIP store + Open XML)
// ══════════════════════════════════════════════════════════
function _crc32(data) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < data.length; i++) {
    c ^= data[i];
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
  }
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function _colLetter(n) {
  let s = ''; n++;
  while (n > 0) { n--; s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26); }
  return s;
}
function _xmlEsc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\x00/g,'');
}

function _buildXlsx(xlRows, colWidths) {
  const enc = new TextEncoder();
  // Shared strings (populated while building worksheet XML)
  const sst = [], sstMap = {};
  function si(s) {
    const k = String(s == null ? '' : s);
    if (k in sstMap) return sstMap[k];
    sstMap[k] = sst.length; sst.push(k); return sst.length - 1;
  }
  // xf styles: 0=text 1=num 2=bold-text 3=bold-num 4=italic-text 5=italic-num 6=small-text 7=small-num
  const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0.00;(#,##0.00)"/></numFmts>
<fonts count="4">
 <font><sz val="11"/><name val="Calibri"/></font>
 <font><sz val="11"/><name val="Calibri"/><b/></font>
 <font><sz val="11"/><name val="Calibri"/><i/></font>
 <font><sz val="9"/><name val="Calibri"/><color rgb="FF6B7280"/></font>
</fonts>
<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>
<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="8">
 <xf numFmtId="0"   fontId="0" fillId="0" borderId="0" xfId="0"/>
 <xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
 <xf numFmtId="0"   fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>
 <xf numFmtId="164" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/>
 <xf numFmtId="0"   fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/>
 <xf numFmtId="164" fontId="2" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/>
 <xf numFmtId="0"   fontId="3" fillId="0" borderId="0" xfId="0" applyFont="1"/>
 <xf numFmtId="164" fontId="3" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/>
</cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`;

  // Worksheet rows XML (also populates sst)
  const rowsXml = xlRows.map((row, ri) => {
    const r = ri + 1;
    const olAttr = row.ol > 0 ? ` outlineLevel="${row.ol}"` : '';
    const cx = row.cells.map((cell, ci) => {
      if (cell == null || cell.v == null) return '';
      const ref = _colLetter(ci) + r, s = cell.s ?? 0;
      if (typeof cell.v === 'number' && isFinite(cell.v))
        return `<c r="${ref}" s="${s}"><v>${cell.v}</v></c>`;
      return `<c r="${ref}" t="s" s="${s}"><v>${si(cell.v)}</v></c>`;
    }).join('');
    return `<row r="${r}"${olAttr}>${cx}</row>`;
  }).join('');

  const colsXml = colWidths.map((w,i) =>
    `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('');
  const wsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetViews><sheetView workbookViewId="0">
 <pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>
</sheetView></sheetViews>
<sheetFormatPr defaultColWidth="18" outlineLevelRow="3"/>
<cols>${colsXml}</cols>
<sheetData>${rowsXml}</sheetData>
</worksheet>`;

  const sstXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="${sst.length}" uniqueCount="${sst.length}">
${sst.map(s=>`<si><t xml:space="preserve">${_xmlEsc(s)}</t></si>`).join('')}
</sst>`;

  const ctXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
 <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
 <Default Extension="xml" ContentType="application/xml"/>
 <Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
 <Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
 <Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/>
 <Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
</Types>`;
  const relsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
 <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`;
  const wbXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets><sheet name="Report" sheetId="1" r:id="rId1"/></sheets></workbook>`;
  const wbRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
 <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
 <Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/>
 <Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`;

  // Build ZIP (method=0, store uncompressed)
  const files = [
    ['[Content_Types].xml',        enc.encode(ctXml)],
    ['_rels/.rels',                enc.encode(relsXml)],
    ['xl/workbook.xml',            enc.encode(wbXml)],
    ['xl/_rels/workbook.xml.rels', enc.encode(wbRelsXml)],
    ['xl/styles.xml',              enc.encode(stylesXml)],
    ['xl/sharedStrings.xml',       enc.encode(sstXml)],
    ['xl/worksheets/sheet1.xml',   enc.encode(wsXml)],
  ];
  const entries = []; let zipOffset = 0;
  for (const [name, data] of files) {
    const nb = enc.encode(name), crc = _crc32(data);
    const lfh = new Uint8Array(30 + nb.length);
    const lv = new DataView(lfh.buffer);
    lv.setUint32(0,0x04034B50,true); lv.setUint16(4,20,true);
    lv.setUint32(14,crc,true); lv.setUint32(18,data.length,true); lv.setUint32(22,data.length,true);
    lv.setUint16(26,nb.length,true); lfh.set(nb,30);
    entries.push({nb,lfh,data,crc,offset:zipOffset});
    zipOffset += lfh.length + data.length;
  }
  const cdParts = entries.map(e => {
    const cd = new Uint8Array(46 + e.nb.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0,0x02014B50,true); cv.setUint16(4,0x0314,true); cv.setUint16(6,20,true);
    cv.setUint32(16,e.crc,true); cv.setUint32(20,e.data.length,true); cv.setUint32(24,e.data.length,true);
    cv.setUint16(28,e.nb.length,true); cv.setUint32(42,e.offset,true);
    cd.set(e.nb,46); return cd;
  });
  const cdSize = cdParts.reduce((s,p)=>s+p.length,0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0,0x06054B50,true); ev.setUint16(8,entries.length,true);
  ev.setUint16(10,entries.length,true); ev.setUint32(12,cdSize,true); ev.setUint32(16,zipOffset,true);
  const all = [...entries.flatMap(e=>[e.lfh,e.data]),...cdParts,eocd];
  const total = all.reduce((s,a)=>s+a.length,0);
  const out = new Uint8Array(total); let pos = 0;
  for (const a of all) { out.set(a,pos); pos+=a.length; }
  return out.buffer;
}

function expRptXLSX() {
  const {struct, mapKey, bils} = rptParams();
  const selBils = bils.filter(b=>rptPeriods.includes(b.period));
  if (!selBils.length) { alert('Nessun periodo selezionato.'); return; }
  const _riclass = rptView.includes('civ') ? (S.riclassCiv||[]) : (S.riclassIFRS||[]);
  const kD = mapKey==='civ'?'civD':mapKey==='corp'?'corpD':'civ6D';
  const kC = mapKey==='civ'?'civC':mapKey==='corp'?'corpC':'civ6C';

  // Build cols (same logic as rRptTable)
  const cols = (() => {
    if (!rptGroupQ) return selBils.map(b=>({label:b.period, bils:[b], isQ:false}));
    const groups = new Map();
    selBils.forEach(b => {
      const [y,m] = b.period.slice(0,7).split('-').map(Number);
      const fy=m>=4?y:y-1, q=Math.floor((m>=4?m-4:m+8)/3)+1, k=`${fy}-Q${q}`;
      if (!groups.has(k)) groups.set(k,{fy,q,bils:[]});
      groups.get(k).bils.push(b);
    });
    return [...groups.values()].map(({fy,q,bils})=>{
      const ends={1:'Giu',2:'Set',3:'Dic',4:'Mar'};
      return {label:`Q${q} ${fy}/${String(fy+1).slice(2)} (al ${ends[q]} ${q===4?fy+1:fy})`, bils, isQ:true};
    });
  })();

  function withAdj(bil,mode,fn) {
    _currentRiclassAdj=calcRiclassAdj(struct,S.mapping,mapKey,bil,mode,_riclass);
    const r=fn(); _currentRiclassAdj=null; return r;
  }
  function colNodeVal(col,nodeId) {
    if(!col.isQ||rptMode==='ptd') return col.bils.reduce((s,b)=>s+withAdj(b,rptMode,()=>nodeTotal(struct,S.mapping,mapKey,b,nodeId,rptMode)),0);
    const last=col.bils[col.bils.length-1];
    return withAdj(last,'ytd',()=>nodeTotal(struct,S.mapping,mapKey,last,nodeId,'ytd'));
  }
  function colAccVal(col,accId) {
    if(!col.isQ||rptMode==='ptd') return col.bils.reduce((s,b)=>s+getBalance(b,accId,rptMode),0);
    return getBalanceYTD(col.bils[col.bils.length-1],accId);
  }
  function colRuleVal(col,rule) {
    function amt(bil,mode) {
      if(rule.active===false||(rule.period&&rule.period!==bil.period)) return 0;
      if(rule.type==='account') {
        const a=S.coa.find(x=>x.id===rule.source); if(!a) return 0;
        const bal=getBalance(bil,a.id,mode); if(!bal) return 0;
        return (rule.amount!=null&&rule.amount>0)?Math.sign(bal)*Math.abs(rule.amount):bal;
      } else {
        const sn=resolveNode(struct,rule.source); if(!sn) return 0;
        const saved=_currentRiclassAdj; _currentRiclassAdj=null;
        const tot=nodeTotal(struct,S.mapping,mapKey,bil,sn,mode);
        _currentRiclassAdj=saved; if(!tot) return 0;
        return (rule.amount!=null&&rule.amount>0)?Math.sign(tot)*Math.abs(rule.amount):tot;
      }
    }
    if(!col.isQ||rptMode==='ptd') return col.bils.reduce((s,b)=>s+amt(b,rptMode),0);
    return amt(col.bils[col.bils.length-1],'ytd');
  }

  // xlRows: [{ol:0-3, cells:[{v,s}]}]
  // s: 0=text 1=num 2=bold-text 3=bold-num 4=italic-text 5=italic-num 6=small-text 7=small-num
  const xlRows = [];
  const SP = '\u00a0\u00a0'; // indent unit (non-breaking spaces)

  // Header row
  xlRows.push({ol:0, cells:[{v:'Codice',s:2},{v:'Voce',s:2},...cols.map(c=>({v:c.label,s:2}))]});

  function addXlNode(node, lv) {
    const isPct = node.formula && /^\s*=?\s*[^+\-]+\/[^+\-]+\s*$/.test(node.formula);
    const sb = lv===0?2:lv===1?4:0; // bold / italic / normal
    const nb = sb+1;                 // num style
    const vals = cols.map(c=>colNodeVal(c,node.id));
    const indent = SP.repeat(lv);
    xlRows.push({
      ol: Math.min(lv,3),
      cells: [
        {v:node.id,   s:sb},
        {v:indent+node.name, s:sb},
        ...vals.map(v => isPct
          ? {v: v!==0?(v*100).toFixed(2).replace('.',',')+' %':'—', s:sb}
          : {v, s:nb})
      ]
    });

    const children = struct.filter(n=>n.parentId===node.id);
    const doDetails = () => {
      if (!rptExpand) return;
      // Conti analitici
      S.coa.forEach(a => {
        const m=S.mapping[a.id]; if(!m) return;
        const r1=resolveNode(struct,m[kD]), r2=resolveNode(struct,m[kC]);
        if(r1!==node.id&&r2!==node.id) return;
        const aVals=cols.map(c=>colAccVal(c,a.id));
        if(!aVals.some(v=>v!==0)) return;
        xlRows.push({ol:Math.min(lv+1,3), cells:[
          {v:a.id, s:6},{v:SP.repeat(lv+1)+a.name, s:6},
          ...aVals.map(v=>({v, s:7}))
        ]});
      });
      // Righe riclassifica
      for (const r of _riclass) {
        if(r.active===false) continue;
        const dstN=resolveNode(struct,r.target);
        const isIn=dstN===node.id;
        const isOut=r.type==='node'
          ? resolveNode(struct,r.source)===node.id
          : (()=>{const mm=S.mapping[r.source];if(!mm)return false;return resolveNode(struct,mm[kD])===node.id||resolveNode(struct,mm[kC])===node.id;})();
        if(!isIn&&!isOut) continue;
        const rVals=cols.map(c=>isIn?colRuleVal(c,r):-colRuleVal(c,r));
        if(!rVals.some(v=>v!==0)) continue;
        const lbl=SP.repeat(lv+1)+(isIn?'↷ ':'↗ ')+(isIn?r.sourceName||r.source:r.targetName||r.target);
        xlRows.push({ol:Math.min(lv+1,3), cells:[
          {v:r.source, s:4},{v:lbl, s:4},
          ...rVals.map(v=>({v, s:5}))
        ]});
      }
    };

    if (!node.totEnd) { doDetails(); children.forEach(c=>addXlNode(c,lv+1)); }
    else              { children.forEach(c=>addXlNode(c,lv+1)); doDetails(); }
  }

  struct.filter(n=>!n.parentId).forEach(n=>addXlNode(n,0));

  const colWidths = [20, 44, ...cols.map(()=>18)];
  const ab = _buildXlsx(xlRows, colWidths);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ab],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download = `report_${rptView}_${rptMode}_${new Date().toISOString().slice(0,10)}.xlsx`;
  a.click(); URL.revokeObjectURL(a.href);
}

function expRptCSV() {
  const {struct, mapKey, bils} = rptParams();
  const selBils=bils.filter(b=>rptPeriods.includes(b.period));
  const rows=[['Tipo','Nodo ID','Nodo Nome','Conto ID','Conto Nome','Periodo','Saldo'].join(';')];
  selBils.forEach(b=>{
    S.coa.forEach(a=>{
      const m2=S.mapping[a.id]; if(!m2) return;
      const kD2=mapKey==='civ'?'civD':'corpD', kC2=mapKey==='civ'?'civC':'corpC';
      const bal=getBalance(b,a.id,rptMode);
      const raw=bal>=0?(m2[kD2]||m2[kC2]):(m2[kC2]||m2[kD2]); if(!raw) return;
      const resolved=resolveNode(struct,raw); if(!resolved) return;
      const node=struct.find(n=>n.id===resolved); if(!node) return;
      const v=getBalance(b,a.id,rptMode);
      if(v!==0) rows.push([rptView,node.id,node.name,a.id,a.name,b.period,v].map(x=>'"'+String(x||'').replace(/"/g,'""')+'"').join(';'));
    });
  });
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(rows.join('\n'));
  a.download=`report_${rptView}_${rptMode}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}


// Cerca un bilancio in entrambi i ledger (usato da recon che non sa il ledger)
function _findBil(period) {
  return S.bilIFRS.find(b=>b.period===period) || S.bilCiv.find(b=>b.period===period) || null;
}
// Tutti i periodi da entrambi i ledger, deduplicati e ordinati
function _allPeriods() {
  const seen=new Set();
  return [...S.bilIFRS,...S.bilCiv].filter(b=>{ if(seen.has(b.period)) return false; seen.add(b.period); return true; }).map(b=>b.period).sort();
}

// ══════════════════════════════════════════════════════════
// RICLASSIFICHE
// ══════════════════════════════════════════════════════════
let riclassLedger = 'ifrs'; // 'ifrs' | 'civ'
let riclassPeriod = null;   // periodo di anteprima selezionato sulla pagina riclassifiche
let _currentRiclassAdj = null; // [{nodeId, delta}] set by rRptTable before nodeTotal calls

function rRiclass() {
  const el = document.getElementById('pg-riclass'); if (!el) return;
  const ledger = riclassLedger;
  const rules   = ledger==='civ' ? (S.riclassCiv||[]) : (S.riclassIFRS||[]);
  const struct   = ledger==='civ' ? S.civilistic : S.corporate;
  const mapKey   = ledger==='civ' ? 'civ6' : 'corp';
  const bils     = ledger==='civ' ? S.bilCiv : S.bilIFRS;
  const allP     = bils.map(b=>b.period);
  const ledgerLabel = ledger==='ifrs' ? '🔵 IFRS' : '🟢 Civilistico';

  function balPreview(r, idx) {
    if (!r.period) return `<span style="font-size:10px;color:#e67e00">⚠ Nessun periodo assegnato — la regola si applica a tutti i periodi</span>`;
    const bil = bils.find(b=>b.period===r.period);
    if (!bil) return `<span style="font-size:10px;color:#c00">⚠ Bilancio per ${esc(r.period)} non caricato</span>`;
    const kD=mapKey==='civ6'?'civ6D':mapKey==='civ'?'civD':'corpD';
    const kC=mapKey==='civ6'?'civ6C':mapKey==='civ'?'civC':'corpC';
    let saldoPre, moved, saldoPost;
    if (r.type==='account') {
      const a = S.coa.find(x=>x.id===r.source);
      if (!a) return `<span style="font-size:10px;color:#c00">⚠ Conto ${esc(r.source)} non trovato nel piano dei conti</span>`;
      const rawYTD = getBalanceYTD(bil, a.id);
      if (rawYTD === 0) return `<span style="font-size:10px;color:#e67e00">⚠ Saldo YTD = 0 in ${esc(r.period)} — la riga non apparirà nel report</span>`;
      // Subtract amounts moved by previous rules on same source+period
      let prevMoved = 0;
      if (idx > 0) {
        const prevRules = rules.slice(0, idx).filter(pr =>
          pr.active !== false && pr.type === 'account' &&
          pr.source === r.source && (pr.period === r.period || !pr.period)
        );
        for (const pr of prevRules) {
          const pm = (pr.amount != null && pr.amount > 0) ? Math.sign(rawYTD)*Math.abs(pr.amount) : rawYTD;
          prevMoved += pm;
        }
      }
      saldoPre = rawYTD - prevMoved;
      if (saldoPre === 0) return `<span style="font-size:10px;color:#e67e00">⚠ Saldo ante rettifica = 0 (le regole precedenti hanno già spostato tutto)</span>`;
      moved = (r.amount != null && r.amount > 0) ? Math.sign(rawYTD)*Math.abs(r.amount) : saldoPre;
      saldoPost = saldoPre - moved;
      const m = S.mapping[a.id];
      const origNode = m ? (resolveNode(struct,m[kD])||resolveNode(struct,m[kC])) : null;
      const origLabel = origNode
        ? `<span style="font-size:10px;color:#666">Nodo attuale: <b>${esc(origNode)}</b></span>`
        : `<span style="font-size:10px;color:#e67e00">⚠ Conto non mappato su struttura ${ledger==='civ'?'Civilistico':'Corporate'}</span>`;
      const prevLabel = prevMoved !== 0
        ? `<span style="font-size:11px;color:#b45309">Già spostato: <b style="font-family:monospace">${fmt(prevMoved)}</b></span>`
        : '';
      return `<div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center">
        ${origLabel}
        <span style="font-size:11px;color:#444">Saldo YTD: <b style="font-family:monospace">${fmt(rawYTD)}</b></span>
        ${prevLabel}
        <span style="font-size:11px;color:#444">Ante rettifica: <b style="font-family:monospace">${fmt(saldoPre)}</b></span>
        <span style="font-size:11px;color:#111">→ Spostamento: <b style="font-family:monospace">${fmt(moved)}</b></span>
        <span style="font-size:11px;color:${Math.abs(saldoPost)<0.01?'#15803d':'#555'}">Residuo: <b style="font-family:monospace">${fmt(saldoPost)}</b>${Math.abs(saldoPost)<0.01?' ✓':''}</span>
      </div>`;
    } else {
      const srcNode = resolveNode(struct, r.source);
      if (!srcNode) return `<span style="font-size:10px;color:#c00">⚠ Nodo ${esc(r.source)} non trovato nella struttura</span>`;
      const saved = _currentRiclassAdj; _currentRiclassAdj = null;
      saldoPre = nodeTotal(struct, S.mapping, mapKey, bil, srcNode, 'ytd');
      _currentRiclassAdj = saved;
      if (saldoPre === 0) return `<span style="font-size:10px;color:#e67e00">⚠ Totale ramo = 0 in ${esc(r.period)} — la riga non apparirà nel report</span>`;
      moved = (r.amount != null && r.amount > 0) ? Math.sign(saldoPre)*Math.abs(r.amount) : saldoPre;
      saldoPost = saldoPre - moved;
      return `<div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center">
        <span style="font-size:11px;color:#444">Totale ramo YTD: <b style="font-family:monospace">${fmt(saldoPre)}</b></span>
        <span style="font-size:11px;color:#111">→ Spostamento: <b style="font-family:monospace">${fmt(moved)}</b></span>
        <span style="font-size:11px;color:${Math.abs(saldoPost)<0.01?'#15803d':'#555'}">Residuo: <b style="font-family:monospace">${fmt(saldoPost)}</b>${Math.abs(saldoPost)<0.01?' ✓':''}</span>
      </div>`;
    }
  }

  function ruleRow(r, i) {
    const typeLabel = r.type==='account' ? '📋 Conto' : '🌿 Ramo';
    const activeStyle = r.active!==false ? 'background:#f0fdf4;border:1px solid #bbf7d0' : 'background:#fafaf9;border:1px solid #e7e5e4;opacity:.6';
    const amtLabel = (r.amount != null && r.amount > 0)
      ? `<span style="font-size:10px;background:#fefce8;color:#854d0e;border:1px solid #fde68a;border-radius:4px;padding:1px 6px">✂ ${fmt(r.amount)}</span>`
      : `<span style="font-size:10px;color:#a8a29e">intero saldo</span>`;
    const periodOpts = allP.map(p=>`<option value="${esc(p)}"${p===r.period?' selected':''}>${esc(p)}</option>`).join('');
    const periodBadge = `<div style="display:flex;align-items:center;gap:5px">
      <span style="font-size:10px;color:#666;font-weight:600">Periodo:</span>
      <select style="font-size:11px;padding:2px 5px;border:1px solid #d4d4d4;border-radius:4px;background:#fff"
        onchange="editRiclassPeriod('${ledger}',${i},this.value)">
        <option value="">— tutti —</option>
        ${periodOpts}
      </select>
    </div>`;
    return `<div style="${activeStyle};border-radius:8px;padding:10px 14px;margin-bottom:8px">
      <div style="display:grid;grid-template-columns:auto 1fr 1fr auto auto auto auto;gap:6px;align-items:start">
        <span style="font-size:11px;background:${r.type==='account'?'#eff6ff':'#f0fdf4'};color:${r.type==='account'?'#1e40af':'#15803d'};border:1px solid ${r.type==='account'?'#bfdbfe':'#bbf7d0'};border-radius:5px;padding:2px 7px;white-space:nowrap;margin-top:2px">${typeLabel}</span>
        <div>
          <div style="font-size:10px;color:#64748b;margin-bottom:2px">Origine</div>
          <div style="font-family:monospace;font-size:12px;font-weight:600">${esc(r.source||'—')}</div>
          ${r.sourceName?`<div style="font-size:10px;color:#78716c">${esc(r.sourceName)}</div>`:''}
        </div>
        <div>
          <div style="font-size:10px;color:#64748b;margin-bottom:2px">→ Destinazione</div>
          <div style="font-family:monospace;font-size:12px;font-weight:600;color:#7e22ce">${esc(r.target||'—')}</div>
          ${r.targetName?`<div style="font-size:10px;color:#78716c">${esc(r.targetName)}</div>`:''}
        </div>
        <button onclick="toggleRiclass('${ledger}',${i})"
          style="padding:3px 9px;border-radius:5px;font-size:11px;cursor:pointer;border:1px solid;${r.active!==false?'background:#f0fdf4;color:#15803d;border-color:#bbf7d0':'background:#fef2f2;color:#dc2626;border-color:#fecaca'}">

function saveRiclass(ledger, type) {
  const source = document.getElementById('rc-source')?.value;
  const target = document.getElementById('rc-target')?.value;
  const note   = document.getElementById('rc-note')?.value||'';
  if (!source||!target) { alert('Seleziona origine e destinazione.'); return; }
  const amtRaw = document.getElementById('rc-amount')?.value;
  const amount = (amtRaw && parseFloat(amtRaw) > 0) ? parseFloat(amtRaw) : null;
  const allItems = type==='account' ? S.coa : [...S.civile,...S.corporate,...S.civilistic];
  const sourceObj = allItems.find(x=>x.id===source);
  const allStructs = [...S.civile,...S.corporate,...S.civilistic];
  const targetObj  = allStructs.find(n=>n.id===target);
  const periodRaw = document.getElementById('rc-period')?.value||'';
  const period = periodRaw.trim() || null;
  const rule = {
    id: Date.now().toString(36),
    type,
    source,
    sourceName: sourceObj?.name||'',
    target,
    targetName: targetObj?.name||'',
    note,
    amount,
    period,
    active: true,
  };
  const key = ledger==='civ' ? 'riclassCiv' : 'riclassIFRS';
  set(s=>({[key]:[...(s[key]||[]),rule]}));
  rRiclass();
}

function toggleRiclass(ledger, i) {
  const key = ledger==='civ' ? 'riclassCiv' : 'riclassIFRS';

function delRiclass(ledger, i) {
  if (!confirm('Eliminare questa riclassifica?')) return;
  const key = ledger==='civ' ? 'riclassCiv' : 'riclassIFRS';
  const rules = [...(S[key]||[])];
  rules.splice(i,1);
  set({[key]:rules});
  rRiclass();
}

// Filtra le opzioni di un <select> in base al testo cercato
function rcFilter(inp, selId) {
  const q = inp.value.toLowerCase().trim();
  const sel = document.getElementById(selId); if (!sel) return;
  let firstVisible = null;
  Array.from(sel.options).forEach(o => {
    const show = !q || o.value.toLowerCase().includes(q) || o.text.toLowerCase().includes(q);
    o.style.display = show ? '' : 'none';
    if (show && !firstVisible && o.value) firstVisible = o;
  });
  if (firstVisible) firstVisible.selected = true;
}

function updateRiclass(ledger, i) {
  const key = ledger==='civ' ? 'riclassCiv' : 'riclassIFRS';
  const rules = [...(S[key]||[])];
  const r = rules[i]; if (!r) return;
  const uid = 're'+i;
  const source = document.getElementById(uid+'-src')?.value || r.source;
  const target = document.getElementById(uid+'-tgt')?.value || r.target;
  const periodRaw = document.getElementById(uid+'-period')?.value||'';
  const period = periodRaw.trim() || null;
  const amtRaw = document.getElementById(uid+'-amount')?.value||'';
  const amount = (amtRaw && parseFloat(amtRaw) > 0) ? parseFloat(amtRaw) : null;
  const note = document.getElementById(uid+'-note')?.value||'';
  const allItems = r.type==='account' ? S.coa : [...(S.civile||[]),...(S.corporate||[]),...(S.civilistic||[])];
  const sourceObj = allItems.find(x=>x.id===source);
  const allStructs = [...(S.civile||[]),...(S.corporate||[]),...(S.civilistic||[])];
  const targetObj  = allStructs.find(n=>n.id===target);
  rules[i] = {...r, source, sourceName: sourceObj?.name||r.sourceName||'', target, targetName: targetObj?.name||r.targetName||'', period, amount, note};
  set({[key]:rules});
  rRiclass();
}

function dupRiclass(ledger, i) {
  const key = ledger==='civ' ? 'riclassCiv' : 'riclassIFRS';
  const rules = [...(S[key]||[])];
  const r = rules[i]; if (!r) return;
  const clone = {...r, id: Date.now().toString(36)};
  rules.splice(i+1, 0, clone);
  set({[key]:rules});
  rRiclass();
}

// RICONCILIAZIONE
let reconNodeId=null
function rRecon(){
  const el=document.getElementById('pg-recon');if(!el)return;
  const allP=_allPeriods();
  reconPeriod=allP.length?allP[allP.length-1]:null; // sempre ultimo periodo
  const bil=_findBil(reconPeriod);

  // Conti con saldo non zero nel periodo corrente (più il conto già selezionato)
  const contiAttivi=S.coa.filter(a=>{
    if(!bil) return false;
    return getBalance(bil,a.id,rptMode)!==0 || a.id===reconNodeId;
  });
  if(!reconNodeId && contiAttivi.length) reconNodeId=contiAttivi[0].id;

  const saldo=bil&&reconNodeId ? getBalanceYTD(bil,reconNodeId) : 0;
  const key=(reconNodeId||'')+'::'+reconPeriod;
  if(!S.recon[key]) S.recon[key]=[];
  const voci=S.recon[key];
  const tot=voci.reduce((s,v)=>s+(v.segno==='+'?1:-1)*N(v.importo),0);
  const sc=saldo-tot;
  const inQ=Math.abs(sc)<0.005;

  function vRow(v,i){
    const k2=esc(key);
    const colSgn=v.segno==='+'?'#15803d':'#dc2626';
    return `<tr style="border-bottom:1px solid #f1f5f9">
      <td style="padding:5px 10px;color:#94a3b8;font-size:11px">${i+1}</td>
      <td style="padding:5px 10px"><input type="text" value="${esc(v.desc||'')}" placeholder="Descrizione…"
        oninput="S.recon['${k2}'][${i}].desc=this.value;save()"
        style="width:100%;border:1px solid #e2e8f0;border-radius:5px;padding:4px 8px;font-size:12px;outline:none"
        onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#e2e8f0'"></td>
      <td style="padding:5px 10px;text-align:center">
        <select onchange="S.recon['${k2}'][${i}].segno=this.value;rRecon()"
          style="border:1px solid #e2e8f0;border-radius:5px;padding:3px 6px;font-size:13px;font-weight:700;color:${colSgn}">
          <option value="+"${v.segno==='+'?' selected':''}>+</option>
          <option value="-"${v.segno==='-'?' selected':''}>−</option>
        </select></td>
      <td style="padding:5px 10px"><input type="number" value="${v.importo||''}" step="0.01" placeholder="0,00"
        oninput="S.recon['${k2}'][${i}].importo=parseFloat(this.value)||0;save();reconRefresh()"
        style="width:100%;border:1px solid #e2e8f0;border-radius:5px;padding:4px 8px;font-size:13px;text-align:right;outline:none;font-family:monospace"
        onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#e2e8f0'"></td>
      <td style="padding:5px 8px;text-align:center"><button onclick="delReconVoce(${i})"
        style="background:none;border:none;cursor:pointer;color:#d6d3d1;font-size:14px;padding:2px 4px;border-radius:4px"
        onmouseenter="this.style.color='#dc2626'" onmouseleave="this.style.color='#d6d3d1'">✕</button></td>
    </tr>`;
  }

  const bodyHTML = voci.length===0
    ? `<tr><td colspan="5" style="padding:28px;text-align:center;color:#a8a29e">Nessuna voce — clicca "+ Aggiungi voce".</td></tr>`
    : voci.map(vRow).join('');

  const footHTML = voci.length>0 ? `
    <tfoot>
      <tr style="background:#f8fafc;border-top:2px solid #e2e8f0">
        <td colspan="3" style="padding:8px 10px;font-size:12px;font-weight:600;color:#334155">Totale voci</td>
        <td id="recon-tot" class="${cn(tot)}" style="padding:8px 10px;text-align:right;font-family:monospace;font-weight:700;font-size:15px">${fmt(tot)}</td>
        <td></td></tr>
      <tr style="background:${inQ?'#f0fdf4':'#fef2f2'}">
        <td colspan="3" style="padding:8px 10px;font-size:13px;font-weight:700;color:${inQ?'#15803d':'#dc2626'}">${inQ?'✓ In quadratura':'⚠ Scarto'}</td>
        <td id="recon-scarto" style="padding:8px 10px;text-align:right;font-family:monospace;font-weight:800;font-size:16px;color:${inQ?'#15803d':'#dc2626'}">${inQ?'0,00':fmt(sc)}</td>
        <td></td></tr>
    </tfoot>` : '';

  const contiOpts = contiAttivi.map(a=>{
    const b2 = bil ? getBalance(bil,a.id,rptMode) : 0;
    return `<option value="${esc(a.id)}"${a.id===reconNodeId?' selected':''}>${esc(a.id)} — ${esc(a.name)} (${fmt(b2)})</option>`;

function _reconAttachKey() {
  return ((reconNodeId||'')+'::'+reconPeriod).replace(/[^a-zA-Z0-9_-]/g,'_');
}

async function loadReconAttachments() {
  const el = document.getElementById('recon-attachments');
  if (!el) return;
  if (!window._fbGetAttachments) {
    el.innerHTML = '<p style="color:#a8a29e;font-size:12px;text-align:center;padding:8px 0">Firebase non disponibile.</p>';
    return;
  }
  const files = await window._fbGetAttachments(_reconAttachKey());
  renderAttachments(files);
}

function renderAttachments(files) {
  const el = document.getElementById('recon-attachments');
  if (!el) return;
  if (!files || !files.length) {
    el.innerHTML = '<p style="color:#a8a29e;font-size:12px;text-align:center;padding:8px 0">Nessun allegato.</p>';
    return;
  }
  el.innerHTML = files.map((f,i) => `
    <div style="display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid #f1f5f9">
      <span style="font-size:18px;flex-shrink:0">📄</span>
      <span style="flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(f.name)}">${esc(f.name)}</span>
      <span style="font-size:10px;color:#94a3b8;flex-shrink:0">${new Date(f.uploadedAt).toLocaleDateString('it-IT')}</span>
      <a href="${esc(f.url)}" target="_blank" title="Apri PDF"
         style="padding:3px 7px;border-radius:5px;background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;font-size:11px;text-decoration:none;flex-shrink:0">👁 Apri</a>
      <a href="${esc(f.url)}" download="${esc(f.name)}" title="Scarica"
         style="padding:3px 7px;border-radius:5px;background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;font-size:11px;text-decoration:none;flex-shrink:0">⬇</a>
      <button onclick="deleteReconPDF(${i})" title="Elimina"
         style="padding:3px 7px;border-radius:5px;background:#fff;color:#dc2626;border:1px solid #fecaca;font-size:11px;cursor:pointer;flex-shrink:0">🗑</button>
    </div>`).join('');
}

async function uploadReconPDF(inp) {
  const files = Array.from(inp.files);
  if (!files.length) return;
  if (!window._fbUploadPDF) { showMsg('msg-attach','err','Firebase Storage non disponibile.'); return; }
  const el = document.getElementById('recon-attachments');
  showMsg('msg-attach','ok','⏳ Caricamento in corso...');
  try {
    const key = _reconAttachKey();
    const existing = await window._fbGetAttachments(key);
    const uploaded = [];
    for (const file of files) {
      if (file.type !== 'application/pdf') { showMsg('msg-attach','err','Solo file PDF.'); continue; }
      if (file.size > 10 * 1024 * 1024) { showMsg('msg-attach','err',file.name+' supera 10MB.'); continue; }
      const meta = await window._fbUploadPDF(key, file);
      uploaded.push(meta);
    }
    const allFiles = [...existing, ...uploaded];
    await window._fbSaveAttachments(key, allFiles);
    renderAttachments(allFiles);
    showMsg('msg-attach','ok','✓ '+uploaded.length+' PDF allegati.');
  } catch(e) { showMsg('msg-attach','err','Errore: '+e.message); }
  inp.value = '';
}

async function deleteReconPDF(idx) {
  if (!confirm('Eliminare questo allegato?')) return;
  if (!window._fbDeletePDF) return;
  try {
    const key = _reconAttachKey();
    const files = await window._fbGetAttachments(key);
    const f = files[idx];
    await window._fbDeletePDF(f.path);
    files.splice(idx, 1);
    await window._fbSaveAttachments(key, files);
    renderAttachments(files);
    showMsg('msg-attach','ok','✓ Allegato eliminato.');
  } catch(e) { showMsg('msg-attach','err','Errore: '+e.message); }
}

// Parsa testo tab-separated e inserisce le voci
function parseAndInsertPaste(text) {
  const lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').filter(l=>l.trim());
  if (!lines.length) { showMsg('msg-recon','err','Nessun dato da incollare.'); return; }
  // Rileva se prima riga è header (contiene "desc" o "import" o "segno")
  const first = lines[0].toLowerCase();
  const si = (first.includes('desc')||first.includes('import')||first.includes('segno')||first.includes('note')) ? 1 : 0;
  // Determina separatore (tab o ;)
  const sep = lines[0].includes('\t') ? '\t' : ';';
  const newVoci = [];
  for (let i=si; i<lines.length; i++) {
    const cols = lines[i].split(sep);
    if (!cols.length) continue;
    // Formato: Descrizione [Segno] [Importo]
    // Supporta anche solo 2 colonne: Descrizione | Importo (segno dal segno del numero)
    let desc='', segno='+', importo=0;
    if (cols.length >= 3) {
      desc = cols[0].trim().replace(/^"|"$/g,'');
      const sRaw = cols[1].trim().replace(/^"|"$/g,'');
      segno = (sRaw==='-'||sRaw.toLowerCase()==='dare') ? '-' : '+';
      const aRaw = cols[2].trim().replace(/^"|"$/g,'').replace(/[.\s]/g,'').replace(',','.');
      importo = Math.abs(parseFloat(aRaw)||0);
    } else if (cols.length === 2) {
      desc = cols[0].trim().replace(/^"|"$/g,'');
      const aRaw = cols[1].trim().replace(/^"|"$/g,'').replace(/[.\s]/g,'').replace(',','.');
      const val = parseFloat(aRaw)||0;
      segno = val < 0 ? '-' : '+';
      importo = Math.abs(val);
    } else if (cols.length === 1) {
      const aRaw = cols[0].trim().replace(/^"|"$/g,'').replace(/[.\s]/g,'').replace(',','.');
      const val = parseFloat(aRaw)||0;
      if (!val) continue;
      segno = val < 0 ? '-' : '+';
      importo = Math.abs(val);
    }
    if (importo === 0 && !desc) continue;
    newVoci.push({desc, segno, importo});
  }
  if (!newVoci.length) { showMsg('msg-recon','err','Nessuna voce riconosciuta. Verifica il formato: Descrizione\tSegno\tImporto'); return; }
  const key = (reconNodeId||'')+'::'+reconPeriod;
  if (!S.recon[key]) S.recon[key] = [];
  const before = S.recon[key].length;
  S.recon[key].push(...newVoci);
  save(); rRecon();
  showMsg('msg-recon','ok','✓ '+newVoci.length+' voci incollate'+(before?' (aggiunte a '+before+' esistenti)':'')+'. Totale: '+S.recon[key].length+'.');
}

// Copia voci negli appunti (formato tab-separated per Excel)
function copyReconVoci() {
  const key = (reconNodeId||'') + '::' + reconPeriod;
  const voci = S.recon[key] || [];
  if (!voci.length) { showMsg('msg-recon','err','Nessuna voce da copiare.'); return; }
  const lines = ['Descrizione	Segno	Importo'];
  voci.forEach(v => {
    lines.push([
      (v.desc||'').replace(/	/g,' '),
      v.segno||'+',
      String(v.importo||0).replace('.',',')
    ].join('	'));
  });
  // Aggiungi riga totale
  const tot = voci.reduce((s,v)=>s+(v.segno==='+'?1:-1)*(v.importo||0), 0);
  lines.push(['TOTALE','',String(tot.toFixed(2)).replace('.',',')].join('	'));
  navigator.clipboard.writeText(lines.join('\n'))
    .then(()=>showMsg('msg-recon','ok','✓ '+voci.length+' voci copiate negli appunti.'))
    .catch(()=>showMsg('msg-recon','err','Errore copia appunti.'));
}

// Importa voci da Excel/CSV
async function importReconVoci(inp) {
  const f = inp.files[0]; if (!f) return;
  try {
    let rows;
    if (f.name.toLowerCase().endsWith('.csv')) {
      rows = parseCSV(await f.text());
    } else {
      const wb = await XLSX.read(await f.arrayBuffer());
      rows = wb.Sheets[wb.SheetNames[0]];
    }
    if (!rows || !rows.length) { showMsg('msg-recon','err','File vuoto.'); return; }
    // Rileva header: desc/descrizione, segno, importo/amount
    const hdr = rows[0].map(c=>String(c||'').toLowerCase().trim());
    const iDesc = hdr.findIndex(c=>c.includes('desc')||c.includes('note')||c.includes('voce')); 
    const iSign = hdr.findIndex(c=>c.includes('segno')||c.includes('sign')||c==='+-'||c==='+/-');
    const iAmt  = hdr.findIndex(c=>c.includes('import')||c.includes('amount')||c.includes('valore'));
    const si = (iDesc>=0||iSign>=0||iAmt>=0) ? 1 : 0; // salta header se trovata
    const dI = iDesc>=0?iDesc:0, sI = iSign>=0?iSign:1, aI = iAmt>=0?iAmt:(si?2:1);
    const newVoci = [];
    for (let i=si; i<rows.length; i++) {
      const r = rows[i]; if (!r || !r[aI]) continue;
      const raw = String(r[aI]||'').replace(/[^\d.,-]/g,'').replace(',','.');
      const amt = parseFloat(raw);
      if (isNaN(amt)) continue;
      const desc = String(r[dI]||'').trim();
      const sRaw = String(r[sI]||'').trim();
      const segno = sRaw==='-'||sRaw.toLowerCase()==='dare'||amt<0 ? '-' : '+';
      newVoci.push({ desc, segno, importo: Math.abs(amt) });
    }
    if (!newVoci.length) { showMsg('msg-recon','err','Nessuna voce trovata nel file.'); inp.value=''; return; }
    const key = (reconNodeId||'') + '::' + reconPeriod;
    if (S.recon[key]?.length) {
      if (!confirm('Sostituire le '+S.recon[key].length+' voci esistenti con '+newVoci.length+' nuove?')) { inp.value=''; return; }
    }
    if (!S.recon[key]) S.recon[key] = [];
    S.recon[key].splice(0, S.recon[key].length, ...newVoci);
    save(); rRecon();
    showMsg('msg-recon','ok','✓ '+newVoci.length+' voci importate.');
  } catch(e) { showMsg('msg-recon','err','Errore: '+e.message); }
  inp.value='';
}

          <tr><td colspan="3" style="font-weight:700">Totale voci</td><td style="text-align:right;font-family:monospace;font-weight:700">${fmt(tot)}</td></tr>
          <tr><td colspan="3" style="font-weight:700">Saldo conto (${rptMode.toUpperCase()})</td><td style="text-align:right;font-family:monospace;font-weight:700">${fmt(saldo)}</td></tr>
          <tr style="background:${inQ?'#f0fdf4':'#fef2f2'}"><td colspan="3" style="font-weight:800;color:${inQ?'#15803d':'#dc2626'}">${inQ?'✓ In quadratura':'⚠ Scarto'}</td><td style="text-align:right;font-family:monospace;font-weight:800;color:${inQ?'#15803d':'#dc2626'}">${inQ?'0,00':fmt(sc)}</td></tr>
        </tfoot>
      </table>`);
  } else {
    // Stampa massiva: tutte le riconciliazioni con voci
    const keys = Object.keys(S.recon).filter(k=>S.recon[k]&&S.recon[k].length>0);
    if (!keys.length) { alert('Nessuna riconciliazione da stampare.'); return; }
    const sections = keys.map(key=>{
      const [nId, period] = key.split('::');
      const conto = S.coa.find(a=>a.id===nId);
      const bil = _findBil(period);
      const voci = S.recon[key]||[];
      const saldo = bil&&nId ? getBalanceYTD(bil,nId) : 0;
      const tot = voci.reduce((s,v)=>s+(v.segno==='+'?1:-1)*N(v.importo),0);
      const sc = saldo-tot;
      const inQ = Math.abs(sc)<0.005;
      const rows = voci.map((v,i)=>`<tr><td>${i+1}</td><td>${esc(v.desc||'')}</td><td style="text-align:center;color:${v.segno==='+'?'#15803d':'#dc2626'};font-weight:700">${v.segno}</td><td style="text-align:right;font-family:monospace">${fmt((v.segno==='+'?1:-1)*N(v.importo))}</td></tr>`).join('');
      return `<div style="page-break-inside:avoid;margin-bottom:28px">
        <p style="font-weight:700;font-size:13px;margin:0 0 3px 0">${esc(nId)} — ${esc(conto?.name||'')} &nbsp; <span style="font-weight:400;color:#64748b">${esc(period)}</span></p>
        <table border="1" cellpadding="4" cellspacing="0" style="width:100%;border-collapse:collapse;font-size:11px">
          <thead><tr style="background:#dbeafe"><th>#</th><th>Descrizione</th><th>+/−</th><th>Importo</th></tr></thead>
          <tbody>${rows}</tbody>
          <tfoot>
            <tr><td colspan="3" style="font-weight:700">Saldo ${rptMode.toUpperCase()}</td><td style="text-align:right;font-family:monospace;font-weight:700">${fmt(saldo)}</td></tr>
            <tr style="background:${inQ?'#f0fdf4':'#fef2f2'}"><td colspan="3" style="font-weight:800;color:${inQ?'#15803d':'#dc2626'}">${inQ?'✓ In quadratura':'⚠ Scarto'}</td><td style="text-align:right;font-family:monospace;font-weight:800;color:${inQ?'#15803d':'#dc2626'}">${inQ?'0,00':fmt(sc)}</td></tr>
          </tfoot>
        </table></div>`;
    }).join('');
    _printWindow(`<h1 style="font-size:15px;margin:0 0 2px 0">${company}</h1>
      <p style="font-size:11px;color:#555;margin:0 0 14px 0">Riconciliazioni — tutti i conti — ${new Date().toLocaleDateString('it-IT')}</p>
      ${sections}`);
  }
}

function _printWindow(bodyHtml) {
  const w = window.open('','_blank','width=900,height=700');
  if (!w) { alert('Popup bloccato — consenti popup per questa pagina.'); return; }
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
    <title>Stampa</title>
    <style>
      body{font-family:-apple-system,sans-serif;margin:20mm 15mm;color:#1c1917}
      table{font-size:11px} th,td{padding:4px 8px;border:1px solid #ccc}
      thead tr{background:#dbeafe} tfoot tr{font-weight:600}
      @page{margin:15mm;size:A4}
      @media print{body{margin:0}}
    </style></head><body>${bodyHtml}</body></html>`);
  w.document.close();
  w.focus();
  setTimeout(()=>w.print(), 400);
}

// ══════════════════════════════════════════════════════════
// ESPORTA / IMPORTA STATO
// ══════════════════════════════════════════════════════════
function exportState() {
  const json = JSON.stringify(S, null, 2);
  const date = new Date().toISOString().slice(0,10);
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(json);
  a.download = 'sap-reclassifier-' + date + '.json';
  a.click();
}

function importState(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      // Valida che abbia almeno le chiavi base
      if (typeof parsed !== 'object' || !parsed.coa) {
        alert('File non valido: manca la struttura attesa.'); return;
      }
      // Merge con BLANK per chiavi mancanti (compatibilità versioni precedenti)
      const merged = { ...BLANK, ...parsed };
      Object.keys(BLANK).forEach(k => { if (!merged[k]) merged[k] = BLANK[k]; });
      S = merged;
      save();
      renderAll();
      alert('✓ Stato importato correttamente.');
    } catch(ex) {
      alert('Errore nel file JSON: ' + ex.message);
    }
    input.value = '';
  };
  reader.readAsText(file, 'utf-8');
}

  const b = document.createElement('div');
  b.id = 'restore-banner';
  b.style.cssText = [
    'position:fixed;bottom:16px;right:16px;z-index:999',
    'background:#1d4ed8;color:#fff',
    'padding:10px 14px;border-radius:10px',
    'display:flex;align-items:center;gap:10px',
    'font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.25)',
    'max-width:340px'
  ].join(';');
  b.innerHTML = `
    <span>📂 Hai un backup <strong>.json</strong> da ripristinare?</span>
    <label style="background:#fff;color:#1d4ed8;font-weight:700;padding:4px 10px;border-radius:5px;cursor:pointer;white-space:nowrap;font-size:11px">
      Carica
      <input type="file" accept=".json" style="display:none"
        onchange="importState(this);document.getElementById('restore-banner').remove()">
    </label>
    <button onclick="document.getElementById('restore-banner').remove()"
      style="background:none;border:none;color:rgba(255,255,255,.7);cursor:pointer;font-size:16px;padding:0;line-height:1">✕</button>`;
  document.body.appendChild(b);
})();
