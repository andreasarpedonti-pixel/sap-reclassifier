<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SAP Reclassifier</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f7f7f7;color:#111;display:flex;height:100vh;overflow:hidden;font-size:13px}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:#ddd;border-radius:4px}
/* SIDEBAR */
#sb{width:200px;flex-shrink:0;background:#fff;border-right:1px solid #e8e8e8;display:flex;flex-direction:column;height:100vh;transition:width .2s;overflow:hidden}
#sb.col{width:44px}
#sb-top{padding:10px 12px;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#sb-logo{overflow:hidden;flex:1;min-width:0}
#sb-logo h1{font-size:12px;font-weight:600;color:#111;white-space:nowrap;transition:opacity .15s}
#sb-logo p{font-size:10px;color:#999;white-space:nowrap;transition:opacity .15s}
#sb.col #sb-logo h1,#sb.col #sb-logo p{opacity:0}
#sb-tog{background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:4px;color:#999;font-size:14px;flex-shrink:0;line-height:1;margin-left:4px}
#sb-tog:hover{background:#f2f2f2;color:#111}
#sb-nav{padding:8px 6px;flex:1;overflow-y:auto;overflow-x:hidden}
.nav-btn{width:100%;display:flex;align-items:center;gap:8px;padding:7px 10px;border:none;background:none;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;color:#666;text-align:left;margin-bottom:1px;transition:background .1s,color .1s;white-space:nowrap;overflow:hidden}
.nav-btn:hover{background:#f2f2f2;color:#111}
.nav-btn.on{background:#f2f2f2;color:#111;font-weight:600}
.nav-ic{font-size:15px;width:20px;flex-shrink:0;text-align:center}
.nav-lbl{transition:opacity .15s,width .2s;overflow:hidden}
#sb.col .nav-lbl{opacity:0;width:0;pointer-events:none}
#sb.col .nav-btn{justify-content:center;padding:9px 0}
/* MAIN */
#main{flex:1;overflow-y:auto;height:100vh;padding:16px 20px}
.pg{display:none;width:100%}.pg.on{display:block}
/* TYPOGRAPHY */
.h1{font-size:18px;font-weight:600;letter-spacing:-.2px}
.sub{font-size:12px;color:#888;margin-top:2px}
.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
/* CARDS */
.card{background:#fff;border:1px solid #e8e8e8;border-radius:6px;overflow:hidden;margin-bottom:14px}
.card-hd{padding:10px 16px;background:#fff;border-bottom:1px solid #e8e8e8;font-size:12px;font-weight:600;color:#444;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-bd{padding:16px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .1s;white-space:nowrap}
.btn-pri{background:#111;color:#fff;border-color:#111}.btn-pri:hover{background:#333;border-color:#333}
.btn-sec{background:#fff;color:#333;border:1px solid #d4d4d4}.btn-sec:hover{background:#f5f5f5}
.btn-del{background:#fff;color:#c00;border:1px solid #f5c6c6}.btn-del:hover{background:#fff5f5}
.btn-sm{padding:4px 9px;font-size:11px;border-radius:4px}
.btn:disabled{opacity:.35;cursor:not-allowed}
/* INPUTS */
input,select{padding:6px 9px;border:1px solid #d4d4d4;border-radius:5px;font-size:12px;outline:none;background:#fff;width:100%;color:#111}
input:focus,select:focus{border-color:#111;box-shadow:0 0 0 2px rgba(0,0,0,.06)}
/* ALERTS */
.alert{padding:9px 13px;border-radius:5px;font-size:12px;margin-bottom:10px;line-height:1.5}
.ok{background:#f5fdf7;border:1px solid #b6e8c6;color:#1a5c32}
.err{background:#fff5f5;border:1px solid #f5c6c6;color:#8b1a1a}
.info{background:#f5f8ff;border:1px solid #c6d8f5;color:#1a3c8b}
.warn{background:#fffdf0;border:1px solid #f0e0a0;color:#6b4800}
/* STATS GRID */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:#fff;border:1px solid #e8e8e8;border-radius:6px;padding:12px 14px}
.stat-l{font-size:11px;color:#999;margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.stat-v{font-size:20px;font-weight:700;font-family:monospace;color:#111}
/* UPLOAD */
.upz{border:1px dashed #ccc;border-radius:6px;padding:28px;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:10px;background:#fafafa}
.upz:hover{border-color:#111;background:#f5f5f5}
/* TABS */
.tabs{display:flex;gap:0;border-bottom:1px solid #e8e8e8;margin-bottom:16px}
.tab{padding:7px 14px;border:none;background:none;border-bottom:2px solid transparent;font-size:12px;font-weight:500;cursor:pointer;color:#888;transition:all .1s;margin-bottom:-1px}
.tab.on{color:#111;border-bottom-color:#111}
.tab:hover{color:#333}
/* TABLE generic */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#888;background:#fafafa;padding:7px 10px;text-align:left;border-bottom:1px solid #e8e8e8}
.tbl td{padding:6px 10px;border-bottom:1px solid #f0f0f0;color:#333}
.tbl tr:hover td{background:#fafafa}
.mono{font-family:'SF Mono',Consolas,monospace;font-size:11px}
/* STRUCT TREE */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0}
.sbox{border:1px solid #e8e8e8;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;flex:1;min-height:0}
.sbox-hd{padding:10px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:1px solid #e8e8e8;background:#fff}
.sbox-add{display:flex;gap:6px;padding:7px 10px;border-bottom:1px solid #e8e8e8;flex-shrink:0;background:#fafafa}
.sbox-bd{flex:1;overflow-y:auto;padding:8px 12px;font-size:13px}
.sn{border-bottom:1px solid #f2f2f2}
.sr{display:flex;align-items:center;padding:4px 6px;gap:4px}
.sr:hover{background:#f7f7f7}
.sr:hover .sa{display:flex}
.sa{display:none;gap:2px;flex-shrink:0}
.ib{background:none;border:none;cursor:pointer;padding:2px 4px;border-radius:3px;font-size:12px;color:#888}
.ib:hover{background:#e8e8e8;color:#111}
/* MAPPING TABLE */
.mt{border:1px solid #e8e8e8;border-radius:6px;overflow:hidden}
.mh,.mr{display:grid;grid-template-columns:24px 110px 1fr 150px 150px 150px 150px;align-items:center;min-height:36px}
.mh{background:#fafafa;border-bottom:1px solid #e8e8e8;font-size:11px;font-weight:600;text-transform:uppercase;color:#888;letter-spacing:.03em}
.mh>div,.mr>div{padding:5px 8px}
.mr{border-bottom:1px solid #f2f2f2}
.mr:hover>div{background:#fafafa}
.mb{max-height:calc(100vh - 360px);overflow-y:auto}
/* SELECT DROPDOWN */
.sw{position:relative}
.sb2{width:100%;padding:3px 7px;border:1px solid #d4d4d4;border-radius:4px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;background:#fff;text-align:left;gap:3px;color:#333}
.sb2.cv{background:#f5fdf7;border-color:#b6e8c6;color:#1a5c32}
.sd{position:fixed;z-index:10000;min-width:280px;background:#fff;border:1px solid #e0e0e0;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.1);overflow:hidden}
.sd input{width:100%;padding:7px 9px;border:none;border-bottom:1px solid #f0f0f0;font-size:11px;outline:none}
.sl{max-height:220px;overflow-y:auto;padding:3px}
.so{padding:5px 9px;border-radius:3px;cursor:pointer;font-size:11px;display:flex;align-items:center;gap:5px;color:#333}
.so:hover{background:#f5f5f5}
.so.sel{background:#f0faf5;color:#1a5c32}
.print-header{display:none}
.print-header h2{font-size:15px;font-weight:700;margin:0 0 2px 0;color:#111}
.print-header p{font-size:11px;color:#666;margin:0}
.print-header hr{border:none;border-top:1px solid #ddd;margin:6px 0 10px 0}
/* REPORT */
.rpt-tbl{width:100%;border-collapse:collapse;font-size:13px}
.rpt-tbl th{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#888;padding:7px 12px;background:#fafafa;border-bottom:1px solid #e8e8e8;white-space:nowrap;text-align:right;position:sticky;top:0;z-index:2;font-weight:600}
.rpt-tbl th:first-child,.rpt-tbl th:nth-child(2){text-align:left}
.rpt-tbl td{padding:4px 12px;border-bottom:1px solid #f2f2f2;text-align:right;white-space:nowrap}
.rpt-tbl td:first-child{text-align:left;white-space:nowrap}
.rpt-tbl td:nth-child(2){text-align:left}
/* Colonna semaforo sticky-right */
.rpt-tbl th:last-child{position:sticky;right:0;z-index:3;background:#fafafa;box-shadow:-2px 0 5px -1px rgba(0,0,0,.09);text-align:center}
.rpt-tbl td:last-child{position:sticky;right:0;z-index:1;box-shadow:-2px 0 4px -1px rgba(0,0,0,.06);text-align:center;padding:2px 8px}
.r-sec>td:last-child{background:#f0f2f5}
.r-grp>td:last-child{background:#f8f9fb}
.r-nod>td:last-child{background:#fff}
.r-acc>td:last-child{background:#fff}
.r-riclass>td:last-child{background:#f0fdf4}
.r-riclass-out>td:last-child{background:#fff7ed}
.r-sec:hover>td:last-child{background:#e8ebf0!important}
.r-grp:hover>td:last-child{background:#f0f2f5!important}
.r-nod:hover>td:last-child,.r-acc:hover>td:last-child{background:#f9fafb!important}
.r-riclass:hover>td:last-child{background:#dcfce7!important}
.r-riclass-out:hover>td:last-child{background:#ffedd5!important}
.r-utile-ai>td:last-child{background:#fff}
.r-utile-netto>td:last-child{background:#fff}
/* Resize handle per colonne */
.col-rh{position:absolute;right:-2px;top:0;bottom:0;width:5px;cursor:col-resize;z-index:10;border-right:2px solid transparent;transition:border-color .15s}
.col-rh:hover,.col-rh.dragging{border-right-color:rgba(0,0,0,.25)}

/* LV0 — SEZIONE */
.r-sec>td{
  background:#f0f2f5;
  color:#111;
  font-weight:700;
  font-size:13px;
  border-top:2px solid #c8cdd6;
  border-bottom:1px solid #c8cdd6;
  padding-top:8px;
  padding-bottom:8px;
}
.r-sec>td:first-child{border-left:4px solid #374151;padding-left:10px}
.r-sec:hover>td{background:#e8ebf0!important}

/* LV1 — GRUPPO */
.r-grp>td{
  background:#f8f9fb;
  color:#374151;
  font-weight:600;
  font-style:italic;
  font-size:12px;
  border-bottom:1px solid #e4e6ea;
}
.r-grp>td:first-child{border-left:3px solid #9ca3af;padding-left:12px}
.r-grp:hover>td{background:#f0f2f5!important}

/* LV2 — NODO */
.r-nod>td{
  background:#fff;
  color:#374151;
  font-weight:500;
  font-size:12px;
  border-bottom:1px solid #eff0f2;
}
.r-nod>td:first-child{border-left:2px solid #d1d5db;padding-left:14px}
.r-nod:hover>td{background:#f9fafb!important}

/* CONTO ANALITICO */
.r-acc>td{
  background:#fff;
  color:#6b7280;
  font-size:10px;
  font-weight:400;
  border-bottom:1px solid #f5f5f5;
}
.r-acc>td:first-child{padding-left:20px}
.r-acc:hover>td{background:#f9fafb!important}

/* TOTALI UTILE */
.r-utile-ai>td{
  background:#fff;
  color:#333;
  font-weight:600;
  font-style:italic;
  font-size:13px;
  border-top:1px solid #d0d0d0;
  border-bottom:1px solid #e8e8e8;
  padding-top:6px;padding-bottom:6px;
}
.r-utile-ai>td:first-child{border-left:3px solid #999;padding-left:10px}
.r-utile-ai:hover>td{background:#f7f7f7!important}

.r-utile-netto>td{
  background:#fff;
  color:#111;
  font-weight:700;
  font-size:14px;
  border-top:1px solid #999;
  border-bottom:1px solid #999;
  padding-top:8px;padding-bottom:8px;
}
.r-utile-netto>td:first-child{border-left:3px solid #111;padding-left:10px}
.r-utile-netto:hover>td{background:#f7f7f7!important}

/* NUMERI */
.neg{color:#c00!important;font-style:normal}
.pos{color:#111!important}
.zero{color:#bbb!important}
/* PROGRESS */
.bar{height:3px;background:#e8e8e8;border-radius:99px;overflow:hidden;margin:4px 0}
.bar-f{height:100%;border-radius:99px}
/* TOGGLE BTN */
.btn-on{background:#111;color:#fff;border:1px solid #111}
.btn-on:hover{background:#333;border-color:#333}
.btn-off{background:#fff;color:#555;border:1px solid #d4d4d4}
.btn-off:hover{background:#f5f5f5}
/* REPORT page full width */
#pg-report{max-width:none!important;padding:0!important}
#rpt-outer{display:flex;flex-direction:column;height:calc(100vh - 32px);gap:6px}
#rpt-controls{flex-shrink:0;padding:8px 0 0 0}
#rpt-kpi-wrap{flex-shrink:0}
#rpt-scroll{flex:1;min-height:0;overflow:auto;border:1px solid #e8e8e8;border-radius:6px}
#rpt-tbl{border-collapse:collapse}
#rpt-tbl td:nth-child(2)[style*="sticky"],
#rpt-tbl th:nth-child(2)[style*="sticky"]{box-shadow:2px 0 4px -1px rgba(0,0,0,.08)}
/* RIGA RICLASSIFICAZIONE NEL REPORT */
.r-riclass>td{background:#f0fdf4;color:#166534;font-size:10px;font-style:italic;border-bottom:1px solid #dcfce7}
.r-riclass>td:first-child{border-left:3px solid #86efac;padding-left:20px}
.r-riclass:hover>td{background:#dcfce7!important}
.r-riclass-out>td{background:#fff7ed;color:#92400e;font-size:10px;font-style:italic;border-bottom:1px solid #fed7aa}
.r-riclass-out>td:first-child{border-left:3px solid #fdba74;padding-left:20px}
.r-riclass-out:hover>td{background:#ffedd5!important}
.r-hidden{display:none!important}
.r-has-kids>td:nth-child(2){cursor:pointer}
.r-has-kids:hover>td{background:rgba(0,0,0,.02)!important}
/* PRINT */
@media print{
  .print-header{display:block!important}
  #sb,#rpt-controls,#rpt-kpi-wrap,.no-print{display:none!important}
  #main{padding:4px!important;height:auto!important;overflow:visible!important}
  #pg-report,#rpt-outer{height:auto!important;display:block!important}
  #rpt-scroll{overflow:visible!important;height:auto!important;border:none!important}
  .rpt-tbl td,.rpt-tbl th{font-size:8px!important;padding:2px 5px!important}
  .neg{color:#c00!important}
  .pos{color:#000!important}
  .r-sec>td{background:#f0f2f5!important;border-top:2px solid #999!important;font-weight:700!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .r-grp>td{background:#f8f9fb!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .r-utile-netto>td{border-top:1px solid #000!important;font-weight:700!important}
  @page{margin:.8cm;size:landscape}
}
#sb.#sb-io{padding:10px 8px;border-top:1px solid #e8e8e8;display:flex;flex-direction:column;gap:6px;flex-shrink:0;margin-top:auto}
#sb.col #sb-io{display:none}
.hidden{display:none}
.note-cell input{transition:border-color .15s}
.note-cell input:focus{outline:none;border-color:#111!important;background:#fff!important}
@media print{.note-cell{display:none!important}}
</style>
<!-- Firebase SDK -->
<script type="module" id="fb-module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject, listAll } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const _fbConfig = {
  apiKey: "AIzaSyB4wW9n5kkPq2TkaYjFxWZxzrNHOUft0sI",
  authDomain: "sap-reclassifier.firebaseapp.com",
  projectId: "sap-reclassifier",
  storageBucket: "sap-reclassifier.firebasestorage.app",
  messagingSenderId: "222721257428",
  appId: "1:222721257428:web:87bbeb7b66ed740b813041"
};

const _fbApp  = initializeApp(_fbConfig);
const _db     = getFirestore(_fbApp);
const _docRef = doc(_db, 'state', 'main');

// Esponi funzioni al contesto globale
window._fbSave = async (data) => {
  try {
    await setDoc(_docRef, { payload: JSON.stringify(data), ts: Date.now() });
    window._fbSetStatus('sync');
  } catch(e) {
    console.error('Firebase save error:', e);
    window._fbSetStatus('err');
  }
};

window._fbLoad = async () => {
  try {
    const snap = await getDoc(_docRef);
    if (snap.exists()) {
      const raw = snap.data().payload;
      return raw ? JSON.parse(raw) : null;
    }
    return null;
  } catch(e) {
    console.error('Firebase load error:', e);
    return null;
  }
};

// Listener real-time: aggiorna se cambia da altro dispositivo
let _fbIgnoreNext = false;
onSnapshot(_docRef, (snap) => {
  if (!snap.exists()) return;
  if (_fbIgnoreNext) { _fbIgnoreNext = false; return; }
  try {
    const remote = JSON.parse(snap.data().payload || '{}');
    const localTs  = parseInt(localStorage.getItem('saprec5_ts') || '0');
    const remoteTs = snap.data().ts || 0;
    if (remoteTs > localTs + 3000) { // remoto più recente di 3s
      window._fbMergeRemote(remote);
      window._fbSetStatus('synced');
    }
  } catch(e) {}
});

const _storage = getStorage(_fbApp);

// Upload PDF attachment for a recon key
window._fbUploadPDF = async (reconKey, file) => {
  const safeName = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const path = `attachments/${reconKey}/${safeName}`;
  const storageRef = ref(_storage, path);
  await uploadBytes(storageRef, file, { contentType: 'application/pdf' });
  const url = await getDownloadURL(storageRef);
  return { name: file.name, path, url, uploadedAt: Date.now() };
};

// Delete a PDF attachment
window._fbDeletePDF = async (path) => {
  const storageRef = ref(_storage, path);
  await deleteObject(storageRef);
};

// List attachments for a recon key (from Firestore metadata)
window._fbGetAttachments = async (reconKey) => {
  try {
    const d = await getDoc(doc(_db, 'attachments', reconKey.replace(/[^a-zA-Z0-9_-]/g, '_')));
    return d.exists() ? (d.data().files || []) : [];
  } catch { return []; }
};

// Save attachment metadata to Firestore
window._fbSaveAttachments = async (reconKey, files) => {
  const safeKey = reconKey.replace(/[^a-zA-Z0-9_-]/g, '_');
  await setDoc(doc(_db, 'attachments', safeKey), { files, updatedAt: Date.now() });
};

window._fbReady = true;
window.dispatchEvent(new Event('fb-ready'));
</script>

<script>
// ══════════════════════════════════════════════════════════
// XLSX PARSER (zero dipendenze, usa API browser native)
// ══════════════════════════════════════════════════════════
const XLSX = (() => {
  async function unzip(ab) {
    const v = new DataView(ab), files = {};
    let eo = -1;
    for (let i = ab.byteLength - 22; i >= 0; i--) {
      if (v.getUint32(i, true) === 0x06054b50) { eo = i; break; }
    }
    if (eo < 0) throw new Error('Not a zip');
    const csz = v.getUint32(eo + 12, true), cst = v.getUint32(eo + 16, true);
    let p = cst;
    while (p < cst + csz) {
      if (v.getUint32(p, true) !== 0x02014b50) break;
      const method = v.getUint16(p + 10, true);
      const csz2   = v.getUint32(p + 20, true);
      const usz    = v.getUint32(p + 24, true);
      const fnl    = v.getUint16(p + 28, true);
      const exl    = v.getUint16(p + 30, true);
      const cml    = v.getUint16(p + 32, true);
      const lho    = v.getUint32(p + 42, true);
      const name   = new TextDecoder().decode(new Uint8Array(ab, p + 46, fnl));
      p += 46 + fnl + exl + cml;
      const lhex = v.getUint16(lho + 28, true);
      const ds   = lho + 30 + fnl + lhex;
      const cd   = new Uint8Array(ab, ds, csz2);
      if (method === 0) { files[name] = cd.slice(); }
      else if (method === 8) {
        try {
          const s = new DecompressionStream('deflate-raw');
          const w = s.writable.getWriter(); w.write(cd); w.close();
          const chunks = []; const r = s.readable.getReader();
          while (true) { const {done,value} = await r.read(); if(done)break; chunks.push(value); }
          const out = new Uint8Array(usz); let off = 0;
          for (const c of chunks) { out.set(c, off); off += c.length; }
          files[name] = out;
        } catch { files[name] = cd; }
      }
    }
    return files;
  }

  function xml(b) { return new DOMParser().parseFromString(new TextDecoder().decode(b),'application/xml'); }
  function col(ref) { const m=ref.match(/^([A-Z]+)/); if(!m)return 0; let n=0; for(const c of m[1]) n=n*26+c.charCodeAt(0)-64; return n-1; }
  function row(ref) { const m=ref.match(/(\d+)$/); return m?parseInt(m[1])-1:0; }

  async function read(ab) {
    const zip = await unzip(ab);
    const sst = {};
    if (zip['xl/sharedStrings.xml']) {
      xml(zip['xl/sharedStrings.xml']).querySelectorAll('si').forEach((si,i)=>{
        sst[i] = [...si.querySelectorAll('t')].map(t=>t.textContent).join('');
      });
    }
    const wbDoc = xml(zip['xl/workbook.xml']);
    const sheets = [...wbDoc.querySelectorAll('sheet')].map(s=>({
      name: s.getAttribute('name'), id: s.getAttribute('r:id')||s.getAttribute('id')
    }));
    const rels = {};
    if (zip['xl/_rels/workbook.xml.rels']) {
      xml(zip['xl/_rels/workbook.xml.rels']).querySelectorAll('Relationship').forEach(r=>{
        rels[r.getAttribute('Id')] = r.getAttribute('Target');
      });
    }
    const result = { SheetNames: sheets.map(s=>s.name), Sheets: {} };
    for (const sh of sheets) {
      const tgt = rels[sh.id] || `worksheets/sheet${sheets.indexOf(sh)+1}.xml`;
      const path = tgt.startsWith('/') ? tgt.slice(1) : `xl/${tgt}`;
      if (!zip[path]) continue;
      const rs = {};
      xml(zip[path]).querySelectorAll('c').forEach(c=>{
        const ref = c.getAttribute('r'); if(!ref) return;
        const ri = row(ref), ci = col(ref), t = c.getAttribute('t');
        const vEl = c.querySelector('v'); if(!vEl) return;
        let val = vEl.textContent;
        if (t==='s') val = sst[parseInt(val)]??'';
        else if (t==='b') val = val==='1';
        else if (!t||t==='n') { const n=parseFloat(val); if(!isNaN(n)) val=n; }
        if (!rs[ri]) rs[ri]=[];
        rs[ri][ci] = val;
      });
      const mx = Math.max(-1,...Object.keys(rs).map(Number));
      const data = [];
      for (let i=0;i<=mx;i++) data.push(rs[i]||[]);
      result.Sheets[sh.name] = data;
    }
    return result;
  }
  return { read };
})();

// ══════════════════════════════════════════════════════════
// CSV PARSER (separatore ; o ,  — gestisce BOM)
// ══════════════════════════════════════════════════════════
function parseCSV(text) {
  if (text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').filter(l=>l.trim());
  if (!lines.length) return [];
  const sep = lines[0].split(';').length > lines[0].split(',').length ? ';' : ',';
  return lines.map(line=>{
    const cols=[]; let cur='', inQ=false;
    for (const ch of line) {
      if (ch==='"') inQ=!inQ;
      else if (ch===sep&&!inQ) { cols.push(cur.trim()); cur=''; }
      else cur+=ch;
    }
    cols.push(cur.trim());
    return cols;
  });
}

// HELPERS
// ══════════════════════════════════════════════════════════
const N  = v => typeof v==='number'&&!isNaN(v)?v:0;
function _fmtAbs(n){const [i,d]=Math.abs(n).toFixed(2).split(".");return i.replace(/\B(?=(\d{3})+(?!\d))/g,".")+","+d;}
const fmt = v => { const n=N(v); return n<0?'('+_fmtAbs(n)+')':_fmtAbs(n); };
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const cn  = v => v<0?'neg':'pos';

function kids(struct, pid) {
  return struct.filter(n=>n.parentId===pid);
}
function descendants(struct, pid) {
  const ch = kids(struct,pid).map(n=>n.id);
  return [...ch,...ch.flatMap(id=>descendants(struct,id))];
}
function depth(struct, id, d=0) {
  const n=struct.find(x=>x.id===id);
  return (!n||!n.parentId)?d:depth(struct,n.parentId,d+1);
}

// Risolve un codice nodo del mapping nella struttura.
// Supporta: match esatto, o prefisso numerico ("1602" → "1602 - Denaro e valori in cassa")
function resolveNode(struct, code) {
  if (!code) return null;
  if (struct.find(n=>n.id===code)) return code;
  const found = struct.find(n=>n.id.startsWith(code+' -')||n.id.startsWith(code+' '));
  return found ? found.id : null;
}

// Saldo di un conto in un bilancio (YTD=fin, PTD=fin-ini)
// Anno fiscale 01/04/Y-31/03/Y+1. PTD = delta vs mese precedente.
function periodYM(p){ return String(p||'').slice(0,7); }
function fiscalYearStart(period) {
  const s=String(period||'').slice(0,7).split('-');
  const y=parseInt(s[0]||0), m=parseInt(s[1]||0);
  return (m>=4?y:y-1)+'-04';
}
function prevBilancio(bil) {
  // Rileva automaticamente a quale ledger appartiene il bilancio
  const inIFRS = S.bilIFRS.some(b=>b.period===bil.period);
  const bils = inIFRS ? S.bilIFRS : S.bilCiv;
  const sorted=[...bils].sort((a,b)=>a.period.localeCompare(b.period));
  const idx=sorted.findIndex(b=>b.period===bil.period);
  return idx>0?sorted[idx-1]:null;
}
function getBalanceYTD(bil,accountId){
  const r=bil.rows.find(x=>x.id===accountId); return r?N(r.fin):0;
}
function getBalance(bil, accountId, mode) {
  if(mode==='ytd') return getBalanceYTD(bil,accountId);
  const prev=prevBilancio(bil);
  if(prev) return getBalanceYTD(bil,accountId)-getBalanceYTD(prev,accountId);
  const r=bil.rows.find(x=>x.id===accountId);
  return r?N(r.fin)-N(r.ini):0;
}

// Totale di un nodo (inclusi discendenti) in un bilancio
// Valuta formula esplicita di un nodo (es: "A + B - C" o "A / B")
// Supporta: +, -, / tra ID nodo. Prefisso "=" ignorato.
function evalFormula(formula, struct, mapping, mapKey, bil, mode) {
  const expr = formula.replace(/^=\s*/, '').trim();
  // Gestione divisione (percentuale): "A / B"
  if (expr.includes('/') && !expr.includes('+') && !expr.includes('-')) {
    const parts = expr.split('/').map(s=>s.trim());
    if (parts.length === 2) {
      const a = nodeTotal(struct, mapping, mapKey, bil, parts[0], mode);
      const b = nodeTotal(struct, mapping, mapKey, bil, parts[1], mode);
      return b !== 0 ? a / b : 0;
    }
  }
  // Tokenizza: split su + e - mantenendo il segno
  let result = 0;
  const tokens = expr.split(/(?=[+\-])/).map(s=>s.trim()).filter(Boolean);
  for (const tok of tokens) {
    const sign = tok.startsWith('-') ? -1 : 1;
    const id   = tok.replace(/^[+\-]\s*/, '').trim();
    if (!id) continue;
    result += sign * nodeTotal(struct, mapping, mapKey, bil, id, mode);
  }
  return result;
}

// Calcola gli aggiustamenti di riclassificazione: lista di {nodeId, delta} da sommare ai totali nodo.
// Per ogni regola attiva: sottrae il delta dal nodo origine, lo aggiunge al nodo destinazione.
function calcRiclassAdj(struct, mapping, mapKey, bil, mode, riclass) {
  const kD = mapKey==='civ'?'civD': mapKey==='corp'?'corpD':'civ6D';
  const kC = mapKey==='civ'?'civC': mapKey==='corp'?'corpC':'civ6C';
  const deltas = {}; // nodeId -> delta
  function applyDelta(nodeId, delta) {
    if (!nodeId) return;
    // Risolvi il nodo e tutti i suoi antenati nella struttura
    function ancestors(id) {
      const result = [];
      let cur = struct.find(n=>n.id===id);
      while (cur) {
        result.push(cur.id);
        cur = struct.find(n=>n.id===cur.parent);
      }
      return result;
    }
    // Il delta va applicato al nodo stesso e risale agli antenati (come fa nodeTotal via scope/descendants)
    // Usiamo un approccio diverso: teniamo solo il delta sul nodo foglia e lo propaghiamo in nodeTotal
    deltas[nodeId] = (deltas[nodeId]||0) + delta;
  }
  for (const r of riclass) {
    if (r.active === false) continue;
    if (r.period && r.period !== bil.period) continue; // filtra per periodo
    if (r.type === 'account') {
      const a = S.coa.find(x=>x.id===r.source);
      if (!a) continue;
      // Calcola il saldo del conto sorgente
      _currentRiclassAdj = null; // evita ricorsione
      const bal = getBalance(bil, a.id, mode);
      if (bal === 0) continue;
      // Il delta da spostare
      let delta;
      if (r.amount != null && r.amount > 0) {
        // Importo parziale: il segno segue il saldo
        delta = Math.sign(bal) * Math.abs(r.amount);
      } else {
        delta = bal;
      }
      // Trova il nodo corrente del conto (dove è mappato nel presente mapKey)
      const rawSrc = bal>=0 ? (mapping[a.id]?.[kD]||mapping[a.id]?.[kC]) : (mapping[a.id]?.[kC]||mapping[a.id]?.[kD]);
      const srcNode = resolveNode(struct, rawSrc);
      // Nodo destinazione riclassifica
      const dstNode = resolveNode(struct, r.target);
      if (!srcNode || !dstNode || srcNode === dstNode) continue;
      applyDelta(srcNode, -delta);
      applyDelta(dstNode, +delta);
    } else if (r.type === 'node') {
      // Riclassifica di ramo: sposta il totale del nodo sorgente → destinazione
      _currentRiclassAdj = null;
      const srcNode = resolveNode(struct, r.source);
      const dstNode = resolveNode(struct, r.target);
      if (!srcNode || !dstNode || srcNode === dstNode) continue;
      const nodeTot = nodeTotal(struct, mapping, mapKey, bil, srcNode, mode);
      if (nodeTot === 0) continue;
      let delta;
      if (r.amount != null && r.amount > 0) {
        delta = Math.sign(nodeTot) * Math.abs(r.amount);
      } else {
        delta = nodeTot;
      }
      applyDelta(srcNode, -delta);
      applyDelta(dstNode, +delta);
    }
  }
  // Converti in lista e propaga agli antenati
  const result = [];
  for (const [nodeId, delta] of Object.entries(deltas)) {
    if (delta === 0) continue;
    // Propaga il delta al nodo stesso e a tutti gli antenati
    let cur = struct.find(n=>n.id===nodeId);
    const visited = new Set();
    while (cur && !visited.has(cur.id)) {
      visited.add(cur.id);
      result.push({nodeId: cur.id, delta});
      cur = struct.find(n=>n.id===cur.parentId);
    }
  }
  return result;
}

function nodeTotal(struct, mapping, mapKey, bil, nodeId, mode) {
  // Se il nodo ha una formula esplicita, usala (evita doppi conteggi)
  const nodeDef = struct.find(n=>n.id===nodeId);
  if (nodeDef?.formula) return evalFormula(nodeDef.formula, struct, mapping, mapKey, bil, mode);
  // mapKey: 'civ'|'corp'|'civ6' — usa civD/civC, corpD/corpC, civ6D/civ6C
  const scope = new Set([nodeId,...descendants(struct,nodeId)]);
  const kD = mapKey==='civ'?'civD': mapKey==='corp'?'corpD':'civ6D';
  const kC = mapKey==='civ'?'civC': mapKey==='corp'?'corpC':'civ6C';
  let total = S.coa.reduce((sum,a)=>{
    const bal = getBalance(bil, a.id, mode);
    const rawTarget = bal>=0 ? (mapping[a.id]?.[kD]||mapping[a.id]?.[kC]) : (mapping[a.id]?.[kC]||mapping[a.id]?.[kD]);
    const target = resolveNode(struct, rawTarget);
    if (!target||!scope.has(target)) return sum;
    return sum + bal;
  }, 0);
  // Applica aggiustamenti di riclassificazione (se attivi)
  if (_currentRiclassAdj) {
    for (const adj of _currentRiclassAdj) {
      if (adj.nodeId === nodeId) total += adj.delta;
    }
  }
  return total;
}

// ══════════════════════════════════════════════════════════
// SAP BALANCE PARSER
// ══════════════════════════════════════════════════════════
function parseSAP(rows) {
  // Legge metadati: società, data inizio (B21=idx20), data fine (B23=idx22)
  const meta = {};
  for (let i=0;i<Math.min(rows.length,30);i++) {
    const k = String(rows[i]?.[0]||'').trim();
    const v = String(rows[i]?.[1]||'').trim();
    if (k==='Società') meta.company = v;
    if (k==='Data di reg. dal') meta.dateFrom = v;
    if (k==='Data di reg. al')  meta.dateTo   = v;
  }
  // Converti data GG.MM.AAAA → AAAA-MM-GG
  function cvDate(s) {
    const m = String(s||'').match(/(\d{1,2})\.(\d{2})\.(\d{4})/);
    return m ? `${m[3]}-${m[2]}-${m[1].padStart(2,'0')}` : s;
  }
  meta.dateFrom = cvDate(meta.dateFrom);
  meta.dateTo   = cvDate(meta.dateTo);
  meta.period   = meta.dateTo || 'Sconosciuto';

  // Parser numerico robusto: gestisce formato italiano (1.388,03), anglosassone (1388.03)
  // e stringhe con segno negativo o parentesi tipo (1.388,03)
  function parseItNum(v) {
    if (typeof v === 'number') return isNaN(v) ? 0 : v;
    let s = String(v || '').trim();
    if (!s) return 0;
    // Parentesi = negativo: (1.388,03) → -1388.03
    const neg = s.startsWith('(') && s.endsWith(')');
    s = s.replace(/[()]/g, '').trim();
    // Rimuovi spazi interni e simboli valuta
    s = s.replace(/\s/g, '').replace(/[€$£]/g, '');
    // Determina formato: se c'è virgola E punto, il più a destra è il decimale
    const hasDot   = s.includes('.');
    const hasComma = s.includes(',');
    if (hasDot && hasComma) {
      // es. 1.388,03 → punto=migliaia, virgola=decimale
      if (s.lastIndexOf('.') < s.lastIndexOf(',')) {
        s = s.replace(/\./g, '').replace(',', '.');
      } else {
        // es. 1,388.03 → virgola=migliaia, punto=decimale
        s = s.replace(/,/g, '');
      }
    } else if (hasComma) {
      // Solo virgola: può essere decimale (1388,03) o migliaia (1,388)
      const parts = s.split(',');
      if (parts.length === 2 && parts[1].length <= 2) {
        s = parts[0] + '.' + parts[1]; // decimale
      } else {
        s = s.replace(/,/g, ''); // migliaia
      }
    }
    // A questo punto solo cifre e punto decimale
    const n = parseFloat(s) || 0;
    return neg ? -n : n;
  }

  // Trova header "Conto Co.Ge."
  const hdrIdx = rows.findIndex(r=>r?.some(c=>String(c||'').includes('Conto Co.Ge.')));
  if (hdrIdx < 0) return null;

  // Colonne: A=codice, B=descr, C=saldo iniziale, D=saldo finale
  const data = [];
  for (let i=hdrIdx+1;i<rows.length;i++) {
    const r = rows[i]; if(!r||!r[0]) continue;
    const id = String(r[0]).trim();
    if (!id || id==='Somma totale') continue;
    const ini = typeof r[2]==='number' ? r[2] : parseItNum(r[2]);
    const fin = typeof r[3]==='number' ? r[3] : parseItNum(r[3]);
    data.push({id, name: String(r[1]||'').trim(), ini, fin});
  }
  return data.length ? { ...meta, rows: data } : null;
}

// ══════════════════════════════════════════════════════════
// MAPPING PARSERS
// ══════════════════════════════════════════════════════════
// Importa mapping da CSV export dell'app (formato: ID;Nome;CivDare;CivAvere;CorpDare;CorpAvere)
// oppure da Excel (foglio mapping con civile)
function parseMappingCSV(rows) {
  const h = rows[0].map(c=>String(c||'').toLowerCase().trim());
  const iID  = h.findIndex(c=>c.includes('id')||c.includes('codice'));
  const iNM  = 1;
  // Formato con Locale/Corp/VI Dir (8 col)
  const iCivD  = h.findIndex(c=>(c.includes('locale')||c.includes('civ'))&&c.includes('dare'));
  const iCivC  = h.findIndex(c=>(c.includes('locale')||c.includes('civ'))&&c.includes('avere'));
  const iCorpD = h.findIndex(c=>c.includes('corp')&&c.includes('dare'));
  const iCorpC = h.findIndex(c=>c.includes('corp')&&c.includes('avere'));
  const iCiv6D = h.findIndex(c=>(c.includes('vi')||c.includes('dir'))&&c.includes('dare'));
  const iCiv6C = h.findIndex(c=>(c.includes('vi')||c.includes('dir'))&&c.includes('avere'));
  // Vecchio formato (4 col): Civile, Corporate
  const iCivOld  = iCivD<0 ? h.findIndex(c=>c.includes('civ')||c.includes('locale')) : -1;
  const iCorpOld = iCorpD<0 ? h.findIndex(c=>c.includes('corp')) : -1;
  const mapping={}, coa=[];
  const seen=new Set();
  for (let i=1;i<rows.length;i++) {
    const r=rows[i]; if(!r||!r[0]) continue;
    const id=String(r[iID>=0?iID:0]).trim();
    const name=String(r[iNM]||'').trim();
    if (!id) continue;
    if (!seen.has(id)) { coa.push({id,name}); seen.add(id); }
    if (iCivD>=0) {
      mapping[id] = {
        civD:  String(r[iCivD]||'').trim(),
        civC:  String(r[iCivC>=0?iCivC:iCivD]||'').trim(),
        corpD: String(r[iCorpD>=0?iCorpD:4]||'').trim(),
        corpC: String(r[iCorpC>=0?iCorpC:(iCorpD>=0?iCorpD+1:5)]||'').trim(),
        civ6D: iCiv6D>=0?String(r[iCiv6D]||'').trim():'',
        civ6C: iCiv6C>=0?String(r[iCiv6C]||'').trim():'',
      };
    } else {
      const c=String(r[iCivOld>=0?iCivOld:2]||'').trim();
      const p=String(r[iCorpOld>=0?iCorpOld:3]||'').trim();
      mapping[id] = { civD:c, civC:c, corpD:p, corpC:p, civ6D:'', civ6C:'' };
    }
  }
  return {mapping, coa};
}

// Importa struttura + mapping da Excel (foglio "mapping con civile")
// Colonne: A=codice, B=descr, C=en, D=Sezione, E=Gruppo, F=Nodo
function parseMappingExcel(rows) {
  const first = rows[0]?.[0];
  const start = (typeof first==='string'&&isNaN(Number(first)))?1:0;
  const sez=new Map(), grp=new Map(), nod=new Map();
  const mapping={}, coa=[];
  const seen=new Set();
  for (let i=start;i<rows.length;i++) {
    const r=rows[i]; if(!r||r[0]==null||r[0]==='') continue;
    const id=String(r[0]).trim();
    const name=String(r[1]||'').trim();
    const s=r[3]!=null?String(r[3]).trim():null;
    const g=r[4]!=null?String(r[4]).trim():null;
    const n=r[5]!=null?String(r[5]).trim():null;
    if (!seen.has(id)) { coa.push({id,name}); seen.add(id); }
    if (!s) continue;
    if (!sez.has(s)) sez.set(s,{id:s,name:s,parentId:null});
    let gId=null;
    if (g) { gId=g; if(!grp.has(g)) grp.set(g,{id:g,name:g,parentId:s}); }
    let nId=null;
    if (n&&n!=='-') { nId=n; if(!nod.has(n)) nod.set(n,{id:n,name:n,parentId:gId||s}); }
    const target = nId||gId||s;
    mapping[id] = { civD: target, civC: target, corpD: '', corpC: '' };
  }
  const struct = [...sez.values(),...grp.values(),...nod.values()];
  return {mapping, coa, struct};
}

function dashKPI() {
  const bils0 = dashLedger==='civ' ? S.bilCiv : S.bilIFRS;
  if (!bils0.length) return '';
  const struct = S.civile.length ? S.civile : S.corporate;
  const mapKey = S.civile.length ? 'civ' : 'corp';
  const selP = dashPeriods.length ? dashPeriods : bils0.map(b=>b.period);
  const bils = [...bils0]
    .filter(b=>selP.includes(b.period))
    .sort((a,b)=>a.period.localeCompare(b.period));
  if (!bils.length) return '<p style="color:#a8a29e;font-size:12px">Nessun periodo selezionato.</p>';

  function fn(...hints) {
    for (const h2 of hints) {
      const lo = h2.toLowerCase();
      let n = struct.find(n=>n.id.toLowerCase()===lo||n.id.toLowerCase().startsWith(lo+' -')||n.id.toLowerCase().startsWith(lo+' '));
      if (n) return n;
      n = struct.find(n=>n.id.toLowerCase().includes(lo)||n.name.toLowerCase().includes(lo));
      if (n) return n;
    }
    return null;
  }

  function cassaTot(b) {
    const nd=fn('16 - disponibilit','disponibilit'); if(!nd) return null;
    const ex=fn('1603'); const exIds=ex?new Set([ex.id,...descendants(struct,ex.id)]):new Set();
    const scope=new Set([nd.id,...descendants(struct,nd.id)].filter(x=>!exIds.has(x)));
    const kD3=mapKey==='civ'?'civD':'corpD', kC3=mapKey==='civ'?'civC':'corpC';
    return S.coa.reduce((s,a)=>{
      const ytd=getBalanceYTD(b,a.id);
      const raw=ytd>=0?(S.mapping[a.id]?.[kD3]||S.mapping[a.id]?.[kC3]):(S.mapping[a.id]?.[kC3]||S.mapping[a.id]?.[kD3]);
      const t=resolveNode(struct,raw);
      return (t&&scope.has(t))?s+getBalance(b,a.id,dashMode):s;
    },0);
  }

  function calcUtileKPI(b, excludeTax) {
    // Struttura Civile: (D + E) - nodo 9 Gestionale
    const civStruct = S.civile;
    const civKey = 'civ';
    const nD = civStruct.find(n=>n.id==='D'||n.id.startsWith('D ')||n.id.startsWith('D-')||n.name.toLowerCase().startsWith('costi'));
    const nE = civStruct.find(n=>n.id==='E'||n.id.startsWith('E ')||n.id.startsWith('E-')||n.name.toLowerCase().startsWith('ricavi'));
    if (!nD && !nE) return null;
    const totD = nD ? nodeTotal(civStruct,S.mapping,civKey,b,nD.id,dashMode) : 0;
    const totE = nE ? nodeTotal(civStruct,S.mapping,civKey,b,nE.id,dashMode) : 0;
    // Sottrai nodo 9 Gestionale da entrambi
    const n9 = civStruct.find(n=>n.id==='9 Gestionale'||n.id==='9'||n.id.startsWith('9 ')||n.name.toLowerCase().includes('gestionale'));
    const tot9 = n9 ? nodeTotal(civStruct,S.mapping,civKey,b,n9.id,dashMode) : 0;
    const utileNetto = totD + totE - tot9;
    if (!excludeTax) return utileNetto;
    // Utile ante imposte = utile netto - nodo 63
    const n63 = civStruct.find(n=>n.id==='63'||n.id.startsWith('63 ')||n.id.startsWith('63-'));
    const tot63 = n63 ? nodeTotal(civStruct,S.mapping,civKey,b,n63.id,dashMode) : 0;
    return utileNetto - tot63;
  }

  function calcGrossProfit(b) {
    // Cerca prima un nodo dedicato nella struttura
    const nGP = fn('gross profit','margine lordo','margine commerciale','contributed margin','gross');
    if (nGP) return nodeTotal(struct,S.mapping,mapKey,b,nGP.id,dashMode);
    // Calcola: Ricavi − Costo del venduto
    const nRev  = fn('4001','ricavi di vendita','ricavi netti','revenues');
    const nCogs = fn('5001','5000','costo del venduto','costo beni venduti','cost of sales','costo delle merci vendute');
    if (!nRev || !nCogs) return null;
    const rev  = nodeTotal(struct,S.mapping,mapKey,b,nRev.id, dashMode);
    const cogs = nodeTotal(struct,S.mapping,mapKey,b,nCogs.id,dashMode);
    return rev + cogs; // COGS è dare (negativo) → somma = gross profit
  }

  function calcOperatingIncome(b) {
    // Cerca prima un nodo dedicato nella struttura
    const nOI = fn('ebit','operating income','risultato operativo','reddito operativo','utile operativo','operating profit','risultato della gestione');
    if (nOI) return nodeTotal(struct,S.mapping,mapKey,b,nOI.id,dashMode);
    // Calcola: GP − Spese operative
    const gp = calcGrossProfit(b); if (gp === null) return null;
    const nOpex = fn('opex','spese operative','costi operativi','operating expenses','costi generali','sg&a');
    if (!nOpex) return null;
    const opex = nodeTotal(struct,S.mapping,mapKey,b,nOpex.id,dashMode);
    return gp + opex; // spese operative in dare (negative) → somma = OI
  }

  // Calcola GP% e OI% rispetto al fatturato (per le note nelle card)
  function gpPct(bils2) {
    const nRev = fn('4001','ricavi di vendita','ricavi netti','revenues');
    if (!nRev) return null;
    const last = bils2[bils2.length-1];
    const rev = nodeTotal(struct,S.mapping,mapKey,last,nRev.id,dashMode);
    const gp  = calcGrossProfit(last);
    if (!rev || gp === null) return null;
    return (gp/Math.abs(rev)*100).toFixed(1)+'%';
  }
  function oiPct(bils2) {
    const nRev = fn('4001','ricavi di vendita','ricavi netti','revenues');
    if (!nRev) return null;
    const last = bils2[bils2.length-1];
    const rev = nodeTotal(struct,S.mapping,mapKey,last,nRev.id,dashMode);
    const oi  = calcOperatingIncome(last);
    if (!rev || oi === null) return null;
    return (oi/Math.abs(rev)*100).toFixed(1)+'%';
  }

  const kpiDefs = [
    {ic:'\u{1f4c8}', label:'Fatturato',         note:'nodo 4001',    color:'#15803d', border:'#bbf7d0', bg:'#f0fdf4',
     f:(b)=>{ const n=fn('4001'); return n?nodeTotal(struct,S.mapping,mapKey,b,n.id,dashMode):null; }},
    {ic:'\u{1f4b9}', label:'Gross Profit',       note:()=>gpPct(bils)||'', color:'#166534', border:'#a7f3d0', bg:'#ecfdf5',
     f:(b)=>calcGrossProfit(b)},
    {ic:'\u{1f3af}', label:'Operating Income',   note:()=>oiPct(bils)||'', color:'#0f4c81', border:'#a5b4fc', bg:'#eef2ff',
     f:(b)=>calcOperatingIncome(b)},
    {ic:'\u{1f4e3}', label:'Marketing',          note:'nodo 5202',    color:'#7e22ce', border:'#e9d5ff', bg:'#faf5ff',
     f:(b)=>{ const n=fn('5202'); return n?nodeTotal(struct,S.mapping,mapKey,b,n.id,dashMode):null; }},
    {ic:'\u{1f3ed}', label:'Magazzino',          note:'',             color:'#0891b2', border:'#bae6fd', bg:'#f0f9ff',
     f:(b)=>{ const n=fn('1201','magazzino'); return n?nodeTotal(struct,S.mapping,mapKey,b,n.id,dashMode):null; }},
    {ic:'\u{1f4b5}', label:'Cassa netta',        note:'escluso 1603', color:'#0369a1', border:'#bfdbfe', bg:'#eff6ff',
     f:(b)=>cassaTot(b)},
    {ic:'\u{1f4ca}', label:'Utile ante imposte', note:'',             color:'#0369a1', border:'#bae6fd', bg:'#f0f9ff',
     f:(b)=>calcUtileKPI(b,true)},
    {ic:'\u{1f4b0}', label:'Utile netto',        note:'',             color:'#0c4a6e', border:'#7dd3fc', bg:'#e0f2fe',
     f:(b)=>calcUtileKPI(b,false)},
  ];

  const cards = kpiDefs.map(d=>{
    const vals = bils.map(b=>d.f(b));
    if (vals.every(v=>v===null)) return '';

    // Ultima riga in grande, le precedenti più piccole
    const rows = bils.map((b,i)=>{
      const v = vals[i];
      const numColor = v===null?'#d1d5db':v<0?'#dc2626':d.color;
      const numStr = v===null ? '—' : fmt(v);
      return '<div style="display:flex;justify-content:space-between;align-items:baseline;'
        + (i>0?'border-top:1px solid '+d.border+';':'')
        + 'padding:5px 0">'
        + '<span style="font-size:12px;color:#64748b;font-weight:400">'+esc(periodYM(b.period))+'</span>'
        + '<span style="font-family:monospace;font-size:13px;font-weight:600;color:'+numColor+'">'+numStr+'</span>'
        + '</div>';
    }).join('');

    return '<div style="background:'+d.bg+';border:1px solid '+d.border+';border-radius:12px;padding:12px 14px;min-width:160px;flex:1">'
      + '<p style="font-size:13px;font-weight:700;color:#334155;margin-bottom:10px">'
      + d.ic+' '+d.label
      + (d.note?(()=>{const n=typeof d.note==='function'?d.note():d.note; return n?'<span style="font-size:9px;color:#a8a29e;margin-left:5px">'+n+'</span>':'';})()):'')
      + '</p>'
      + rows
      + '</div>';
  }).filter(Boolean).join('');

  return '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px">'+cards+'</div>';
}

async function impBil(inp) {
  const files=[...inp.files].filter(f=>!f.name.startsWith('~$'));
  if(!files.length) return;
  const ledger = impLedger; // 'ifrs' o 'civ'
  const bilKey = ledger==='civ' ? 'bilCiv' : 'bilIFRS';
  showMsg('msg-bil','info','Lettura file (Ledger '+(ledger==='civ'?'Civilistico':'IFRS')+')...');
  let ok=0, err=[];
  for (const f of files) {
    try {
      const wb = await XLSX.read(await f.arrayBuffer());
      const rows = wb.Sheets[wb.SheetNames[0]];
      const bil = parseSAP(rows);
      if (!bil) { err.push(f.name+': formato non riconosciuto'); continue; }
      set(s=>{
        const others = (s[bilKey]||[]).filter(b=>b.period!==bil.period);
        return { [bilKey]: [...others, bil].sort((a,b)=>a.period.localeCompare(b.period)) };
      });
      // Salva handle per auto-reload (File System Access API)
      if (f.handle) _fileHandles.set(ledger+'::'+bil.period, { handle: f.handle, period: bil.period, ledger });
      ok++;
    } catch(e) { err.push(f.name+': '+e.message); }
  }
  const msg = ok ? `✓ ${ok} bilancio/i importato/i nel ledger ${ledger==='civ'?'Civilistico':'IFRS'}.` : '';
  const errMsg = err.length ? '<br>⚠ '+err.join('<br>') : '';
  showMsg('msg-bil', ok?'ok':'err', msg+errMsg);
  inp.value='';
  rImpTab();
}

// Ricarica un singolo bilancio dal suo file handle
async function reloadBil(period, ledger) {
  const fkey = (ledger||'ifrs')+'::'+period;
  const entry = _fileHandles.get(fkey);
  if (!entry) { alert('Handle non disponibile — ricarica il file manualmente.'); return; }
  const bilKey = (ledger||'ifrs')==='civ' ? 'bilCiv' : 'bilIFRS';
  try {
    const perm = await entry.handle.queryPermission({ mode: 'read' });
    if (perm !== 'granted') {
      const req = await entry.handle.requestPermission({ mode: 'read' });
      if (req !== 'granted') { alert('Permesso negato.'); return; }
    }
    const file = await entry.handle.getFile();
    const wb = await XLSX.read(await file.arrayBuffer());
    const bil = parseSAP(wb.Sheets[wb.SheetNames[0]]);
    if (!bil) { alert(entry.handle.name + ': formato non riconosciuto'); return; }
    set(s=>({ [bilKey]: [...(s[bilKey]||[]).filter(b=>b.period!==bil.period), bil].sort((a,b)=>a.period.localeCompare(b.period)) }));
    _fileHandles.set(fkey, { handle: entry.handle, period: bil.period, ledger: ledger||'ifrs' });
    rImpTab();
    showMsg('msg-bil','ok','✓ Periodo '+period+' ricaricato.');
  } catch(e) { alert('Errore: '+e.message); }
}

// Ricarica tutti i bilanci con handle disponibile
async function reloadAll() {
  if (!_fileHandles.size) { alert('Nessun file handle disponibile. Carica i file almeno una volta in questa sessione.'); return; }
  showMsg('msg-bil','info','🔄 Ricarico tutti i file...');
  let ok=0, err=[];
  for (const [fkey, entry] of _fileHandles) {
    try {
      const perm = await entry.handle.queryPermission({ mode: 'read' });
      if (perm !== 'granted') await entry.handle.requestPermission({ mode: 'read' });
      const file = await entry.handle.getFile();
      const wb = await XLSX.read(await file.arrayBuffer());
      const bil = parseSAP(wb.Sheets[wb.SheetNames[0]]);
      if (!bil) { err.push(fkey+': non riconosciuto'); continue; }
      const ledger = entry.ledger || 'ifrs';
      const bilKey = ledger==='civ' ? 'bilCiv' : 'bilIFRS';
      set(s=>({ [bilKey]: [...(s[bilKey]||[]).filter(b=>b.period!==bil.period), bil].sort((a,b)=>a.period.localeCompare(b.period)) }));
      ok++;
    } catch(e) { err.push(fkey+': '+e.message); }
  }
  rImpTab();
  const msg = ok ? '✓ '+ok+' periodo/i ricaricato/i.' : '';
  const errMsg = err.length ? ' ⚠ '+err.join(', ') : '';
  showMsg('msg-bil', ok?'ok':'err', msg+errMsg);
}

// Usa File System Access API per aprire file con handle
async function pickBilFile() {
  if (!window.showOpenFilePicker) {
    document.getElementById('fi-bil').click(); return;
  }
  const ledger = impLedger;
  const bilKey = ledger==='civ' ? 'bilCiv' : 'bilIFRS';
  try {
    const handles = await window.showOpenFilePicker({
      multiple: true,
      types: [{ description: 'SAP Excel', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }]
    });
    showMsg('msg-bil','info','Lettura file (Ledger '+(ledger==='civ'?'Civilistico':'IFRS')+')...');
    let ok=0, err=[];
    for (const handle of handles) {
      try {
        const file = await handle.getFile();
        const wb = await XLSX.read(await file.arrayBuffer());
        const bil = parseSAP(wb.Sheets[wb.SheetNames[0]]);
        if (!bil) { err.push(handle.name+': formato non riconosciuto'); continue; }
        set(s=>({ [bilKey]: [...(s[bilKey]||[]).filter(b=>b.period!==bil.period), bil].sort((a,b)=>a.period.localeCompare(b.period)) }));
        _fileHandles.set(ledger+'::'+bil.period, { handle, period: bil.period, ledger });
        ok++;
      } catch(e) { err.push(handle.name+': '+e.message); }
    }
    rImpTab();
    const msg = ok ? '✓ '+ok+' bilancio/i importato/i nel ledger '+(ledger==='civ'?'Civilistico':'IFRS')+' — 🔄 ricarica automatica attiva.' : '';
    const errMsg = err.length ? '<br>⚠ '+err.join('<br>') : '';
    showMsg('msg-bil', ok?'ok':'err', msg+errMsg);
  } catch(e) { if (e.name!=='AbortError') alert('Errore: '+e.message); }
}

async function pickFolder() {
  if (!window.showDirectoryPicker) {
    alert("Il tuo browser non supporta la selezione cartella.\nUsa Chrome o Edge.");
    return;
  }
  try {
    const folder = await window.showDirectoryPicker({ mode: "read" });
    _folderHandle = folder;
    _folderName   = folder.name;
    rImpTab();
    await loadFromFolder(false);
  } catch(e) {
    if (e.name !== "AbortError") alert("Errore: " + e.message);
  }
}

async function loadFromFolder(silent) {
  if (!_folderHandle) { alert("Nessuna cartella selezionata."); return; }
  const perm = await _folderHandle.queryPermission({ mode: "read" });
  if (perm !== "granted") {
    const req = await _folderHandle.requestPermission({ mode: "read" });
    if (req !== "granted") { alert("Permesso negato."); return; }
  }
  const ledger = impLedger;
  const bilKey = ledger==='civ' ? 'bilCiv' : 'bilIFRS';
  if (!silent) showMsg("msg-bil","info","🔄 Lettura cartella (Ledger "+(ledger==='civ'?'Civilistico':'IFRS')+") …");
  let ok=0, changed=0, skipped=0, errs=[];
  for await (const [name, entry] of _folderHandle.entries()) {
    if (entry.kind !== "file") continue;
    if (!name.toLowerCase().endsWith(".xlsx")) continue;
    if (name.startsWith("~$")) continue;
    try {
      const file = await entry.getFile();
      const wb   = await XLSX.read(await file.arrayBuffer());
      const sheetName = wb.SheetNames[0];
      if (!sheetName || !wb.Sheets[sheetName]) { skipped++; continue; }
      const bil  = parseSAP(wb.Sheets[sheetName]);
      if (!bil) { skipped++; continue; }
      set(s=>({ [bilKey]:[...(s[bilKey]||[]).filter(b=>b.period!==bil.period),bil]
                          .sort((a,b)=>a.period.localeCompare(b.period)) }));
      _fileHandles.set(ledger+'::'+bil.period, { handle:entry, period:bil.period, ledger });
      ok++; changed++;
    } catch(e) { errs.push(name+": "+e.message); }
  }
  rImpTab();
  if (!silent || changed>0) {
    const msg = ok
      ? "✓ "+ok+" file letti da \""+esc(_folderName||"")+"\""
        +(changed?" — "+changed+" aggiornati":" — nessuna variazione")
        +(skipped?" ("+skipped+" non SAP ignorati)":"")+"."
      : "Nessun file SAP trovato nella cartella.";
    const errMsg = errs.length?" ⚠ "+errs.join(", "):"";
    showMsg("msg-bil", ok?"ok":"err", msg+errMsg);
  }
  if (ok>0) renderAll();
}

async function impMap(inp) {
  const f=inp.files[0]; if(!f) return;
  showMsg('msg-map','info','Lettura file...');
  try {
    let mapping, coa, struct=null;
    if (f.name.toLowerCase().endsWith('.csv')) {
      const rows = parseCSV(await f.text());
      ({mapping,coa} = parseMappingCSV(rows));
    } else {
      const wb = await XLSX.read(await f.arrayBuffer());
      const shMap = wb.SheetNames.find(n=>n.toLowerCase().includes('mapping')||n.toLowerCase().includes('civil'))
                    || wb.SheetNames[1] || wb.SheetNames[0];
      const shCoa = wb.SheetNames.find(n=>n.toLowerCase().includes('piano')) || wb.SheetNames[0];
      const res = parseMappingExcel(wb.Sheets[shMap]);
      mapping=res.mapping; coa=res.coa; struct=res.struct; // mapping già in formato {civD,civC,corpD,corpC}
      // Se c'è anche un foglio piano conti separato, usa quello per i nomi
      if (shCoa!==shMap) {
        const coaRows=wb.Sheets[shCoa];
        const first=coaRows[0]?.[0];
        const start=(typeof first==='string'&&isNaN(Number(first)))?1:0;
        const seen=new Set(); coa=[];
        for(let i=start;i<coaRows.length;i++){
          const r=coaRows[i]; if(!r||r[0]==null) continue;
          const id=String(r[0]).trim(), name=String(r[1]||'').trim();
          if(id&&!seen.has(id)){coa.push({id,name});seen.add(id);}
        }
      }
    }
    const nM=Object.keys(mapping).length;
    if(!nM){showMsg('msg-map','err','Nessun mapping trovato.');inp.value='';return;}
    set(s=>({
      coa: coa.length>0 ? coa : s.coa,
      mapping: {...s.mapping,...mapping},
      civile: struct&&struct.length>0 ? struct : s.civile,
    }));
    const msgs=[`✓ Mapping: ${nM} conti`];
    if(coa.length) msgs.push(`✓ Piano dei conti: ${coa.length} conti`);
    if(struct&&struct.length) msgs.push(`✓ Struttura civile: ${struct.length} nodi`);
    showMsg('msg-map','ok',msgs.join('<br>'));
  } catch(e) { showMsg('msg-map','err','Errore: '+e.message); }
  inp.value='';
}

function _structByKey(key){ return key==='civ'?S.civile:key==='corp'?S.corporate:S.civilistic; }
function _setStruct(key,s){ if(key==='civ') set({civile:s}); else if(key==='corp') set({corporate:s}); else set({civilistic:s}); }

function addNode(key,parentId) {
  const id=(document.getElementById('sid-'+key)?.value||'').trim();
  const nm=(document.getElementById('snm-'+key)?.value||'').trim();
  if(!id||!nm){alert('Inserisci ID e Nome');return;}
  const struct=[..._structByKey(key)];
  if(struct.some(n=>n.id===id)){alert('ID già presente');return;}
  struct.push({id,name:nm,parentId:parentId||null});
  _setStruct(key,struct);
}
function addNodeChild(key,parentId) {
  const id=prompt('ID figlio di "'+parentId+'":'); if(!id) return;
  const nm=prompt('Nome:'); if(!nm) return;
  const struct=[..._structByKey(key)];
  if(struct.some(n=>n.id===id)){alert('ID già presente');return;}
  struct.push({id,name:nm,parentId});
  _setStruct(key,struct);
}
function delNode(key,id) {
  if(!confirm('Eliminare "'+id+'" e tutti i figli?')) return;
  const orig=_structByKey(key);
  const del=new Set([id]); let ch=true;
  while(ch){ch=false;orig.forEach(n=>{if(n.parentId&&del.has(n.parentId)&&!del.has(n.id)){del.add(n.id);ch=true;}});}
  _setStruct(key,orig.filter(n=>!del.has(n.id)));
}
function toggleTotEnd(key,id) {
  const struct=[..._structByKey(key)];
  const n=struct.find(x=>x.id===id); if(!n) return;
  n.totEnd=!n.totEnd;
  _setStruct(key,struct);
}

function saveSNode(key, id) {
  const editId = 'sne-'+key+'-'+id;
  const nm = document.getElementById(editId+'-nm')?.value?.trim();
  const fo = document.getElementById(editId+'-fo')?.value?.trim();
  if (!nm) { alert('Il nome non può essere vuoto.'); return; }
  const struct = [..._structByKey(key)];
  const node = struct.find(n=>n.id===id); if (!node) return;
  node.name = nm;
  if (fo) node.formula = fo; else delete node.formula;
  _setStruct(key, struct);
}
async function importStruct(key,inp) {
  const f=inp.files[0]; if(!f) return;
  try {
    let rows;
    if(f.name.toLowerCase().endsWith('.csv')) rows=parseCSV(await f.text());
    else { const wb=await XLSX.read(await f.arrayBuffer()); rows=wb.Sheets[wb.SheetNames[0]]; }
    const h=rows[0].map(c=>String(c||'').toLowerCase());
    const si=h.some(c=>c==='id'||c==='codice'||c.includes('codice')||c==='a (codice)')?1:0;
    const ic=h.findIndex(c=>c==='id'||c==='codice'||c.includes('codice')||c==='a (codice)'); const iID=ic>=0?ic:0;
    const in2=h.findIndex(c=>c.includes('nome')||c.includes('descr')||c.includes('name')||c==='b (voce)'); const iNM=in2>=0?in2:1;
    const ip=h.findIndex(c=>c.includes('parent')||c.includes('padre')||c==='c (parent)'); const iPR=ip>=0?ip:2;
    const ifo=h.findIndex(c=>c.includes('formula')||c.includes('calcolo')||c.includes('tipo')||c==='d (tipocalcolo)'); const iFO=ifo>=0?ifo:3;
    const out=[]; const seen=new Set();
    for(let i=si;i<rows.length;i++){
      const r=rows[i]; if(!r||!r[iID]) continue;
      const id=String(r[iID]).trim(), nm=String(r[iNM]||'').trim();
      const pr=r[iPR]?String(r[iPR]).trim():null;
      const fo=r[iFO]?String(r[iFO]).trim():null;
      const formula=(fo&&fo!=='Dettaglio'&&fo!=='')?fo:null;
      if(id&&nm&&!seen.has(id)){out.push({id,name:nm,parentId:pr||null,formula:formula||undefined});seen.add(id);}
    }
    // Crea automaticamente nodi radice mancanti (referenziati come parent ma non dichiarati)
    const outIds = new Set(out.map(n=>n.id));
    const missingRoots = new Set();
    out.forEach(n=>{ if(n.parentId && !outIds.has(n.parentId)) missingRoots.add(n.parentId); });
    missingRoots.forEach(id=>{ out.unshift({id, name:id, parentId:null}); });
    if(!out.length){alert('Nessun nodo trovato');inp.value='';return;}
    const labels={civ:'Locale',corp:'IFRS Corporate',civ6:'Civilistico VI Dir'};
    if(!confirm(`Trovati ${out.length} nodi. Sostituire la struttura ${labels[key]||key}?`)){inp.value='';return;}
    const cfg=_sboxCfg(key);
    _setStruct(key,out);
    renderSBox(key,cfg.t,out,cfg.bg,cfg.br,cfg.co);
  } catch(e){alert('Errore: '+e.message);}
  inp.value='';
}
function exportStructCSV(key) {
  const struct=_structByKey(key);
  const rows=['ID,Nome,ParentID,Formula',...struct.map(n=>[n.id,n.name,n.parentId||'',n.formula||''].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))];
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(rows.join('\n'));
  a.download=`struttura_${key}.csv`; a.click();
}

function rMapRows() {
  const el=document.getElementById('map-rows'); if(!el) return;
  const lo=mapSrch.toLowerCase();
  const filt=S.coa.filter(a=>{
    if(lo&&!a.id.toLowerCase().includes(lo)&&!a.name.toLowerCase().includes(lo)) return false;
    const m=S.mapping[a.id]||{};
    const hasCiv=!!(m.civD||m.civC), hasCorp=!!(m.corpD||m.corpC), hasCiv6=!!(m.civ6D||m.civ6C);
    if(mapFilt==='done'&&!(hasCiv&&hasCorp&&hasCiv6)) return false;
    if(mapFilt==='inc'&&hasCiv&&hasCorp&&hasCiv6) return false;
    return true;
  });
  const cnt=document.getElementById('map-cnt');
  if(cnt) cnt.textContent=filt.length+' conti';
  if(!filt.length){el.innerHTML='<p style="text-align:center;padding:24px;color:#a8a29e;font-size:12px">Nessun conto trovato.</p>';return;}
  el.innerHTML=filt.map(a=>{
    const m=S.mapping[a.id]||{};
    const hasCiv=!!(m.civD||m.civC), hasCorp=!!(m.corpD||m.corpC), hasCiv6=!!(m.civ6D||m.civ6C);
    const ok=hasCiv&&hasCorp&&hasCiv6;
    const half=(hasCiv||hasCorp||hasCiv6)&&!ok;
    const ic=ok?'<span style="color:#22c55e;font-size:14px">✓</span>':half?'<span style="color:#f59e0b;font-size:14px">◑</span>':'<span style="color:#d6d3d1;font-size:14px">○</span>';

      <div><span class="mono" style="font-size:13px">${esc(a.id)}</span></div>

}

function mkSel(accountId,field,struct,value) {
  const node=struct.find(n=>n.id===value||n.id.startsWith(value+' '));
  const label=node?(node.id.length>22?node.id.slice(0,20)+'…':node.id):(value||'—');
  const uid=`sel_${accountId}_${field}`;
  return `<div class="sw" id="wrap_${uid}">
    <button type="button" class="sb2${value?' cv':''}" onclick="toggleDrop('${uid}','${esc(accountId)}','${field}')" title="${esc(node?.name||'')}">
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px">${esc(label)}</span>
      <span style="display:flex;align-items:center;gap:2px;flex-shrink:0">
        ${value?`<span onclick="event.stopPropagation();setMap('${esc(accountId)}','${field}','')" style="font-size:10px;cursor:pointer">✕</span>`:''}▾
      </span>
    </button>
  </div>`;
}

function toggleDrop(uid,accountId,field) {
  if(_openDrop&&_openDrop!==uid){document.getElementById('drop_'+_openDrop)?.remove();}
  if(document.getElementById('drop_'+uid)){document.getElementById('drop_'+uid).remove();_openDrop=null;return;}
  _openDrop=uid;
  const struct=(field==='civD'||field==='civC')?S.civile:(field==='corpD'||field==='corpC')?S.corporate:S.civilistic;
  const wrap=document.getElementById('wrap_'+uid); if(!wrap) return;
  const drop=document.createElement('div');
  drop.className='sd'; drop.id='drop_'+uid;
  const si=document.createElement('input'); si.type='text'; si.placeholder='Cerca...';
  si.oninput=()=>fillDrop(drop,struct,accountId,field,si.value);
  drop.appendChild(si);
  const list=document.createElement('div'); list.className='sl'; drop.appendChild(list);
  // Agganciato a body per evitare clipping da overflow:hidden / transform su antenati
  document.body.appendChild(drop);
  // Posizionamento smart: apri verso l'alto se c'è poco spazio sotto
  requestAnimationFrame(() => {
    const rect = wrap.getBoundingClientRect();
    const dropH = Math.min(360, window.innerHeight * 0.5);
    const spaceBelow = window.innerHeight - rect.bottom;
    const spaceAbove = rect.top;
    drop.style.width = Math.max(300, rect.width) + 'px';
    if (spaceBelow < dropH + 10 && spaceAbove > spaceBelow) {
      // Apri verso l'alto
      drop.style.bottom = (window.innerHeight - rect.top + 2) + 'px';
      drop.style.top = 'auto';
    } else {
      // Apri verso il basso
      drop.style.top = (rect.bottom + 2) + 'px';
      drop.style.bottom = 'auto';
    }
    drop.style.left = rect.left + 'px';
    // Limita altezza in base allo spazio disponibile
    const sl = drop.querySelector('.sl');
    if (sl) {
      const maxH = Math.min(320, (spaceBelow < dropH ? spaceAbove : spaceBelow) - 50);
      sl.style.maxHeight = maxH + 'px';
    }
  });
  fillDrop(drop,struct,accountId,field,'');
  si.focus();
  setTimeout(()=>document.addEventListener('click',function h(e){
    if(!drop.contains(e.target)&&!wrap.contains(e.target)){drop.remove();_openDrop=null;document.removeEventListener('click',h);}
  }),0);
}

function fillDrop(drop,struct,accountId,field,search) {
  const list=drop.querySelector('.sl'); if(!list) return;
  const cur=(S.mapping[accountId]||{})[field]||'';
  const lo=search.toLowerCase();
  const vis=lo?struct.filter(n=>n.id.toLowerCase().includes(lo)||n.name.toLowerCase().includes(lo)):struct;
  if(!vis.length){list.innerHTML='<div style="text-align:center;color:#a8a29e;padding:8px;font-size:11px">Nessun risultato</div>';return;}
  // In search mode: mostra tutto piatto; altrimenti albero collassato
  if(lo) {
    list.innerHTML=vis.map(n=>{
      const isSel=n.id===cur;
      return `<div class="so${isSel?' sel':''}" style="padding-left:9px" onclick="setMap('${esc(accountId)}','${field}','${esc(n.id)}')">
        <span style="font-family:monospace;font-size:10px;color:#a8a29e;min-width:50px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n.id.length>14?n.id.slice(0,13)+'…':n.id)}</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n.name)}</span>
        ${isSel?'<span>✓</span>':''}
      </div>`;
    }).join('');
    return;
  }
  // Albero con expand lazy — solo radici visibili, figli caricati al click
  const dropExp=new Set(); // espansi in questo dropdown
  // Se il nodo corrente è selezionato, espandi il suo path
  if(cur) {
    let n=struct.find(x=>x.id===cur);
    while(n&&n.parentId){const p=struct.find(x=>x.id===n.parentId);if(p){dropExp.add(p.id);}n=p;}
  }
  function nodeHTML(n,lv) {
    const isSel=n.id===cur;
    const ch=struct.filter(c=>c.parentId===n.id);
    const isExp=lv===0||dropExp.has(n.id);
    const tog=ch.length
      ? `<span class="dtog" data-nid="${esc(n.id)}" style="cursor:pointer;margin-right:3px;font-size:9px;color:#94a3b8">${isExp?'▼':'▶'}</span>`
      : '<span style="display:inline-block;width:11px"></span>';
    return `<div class="so${isSel?' sel':''}" style="padding-left:${lv*12+9}px" onclick="setMap('${esc(accountId)}','${field}','${esc(n.id)}')">
      ${tog}
      <span style="font-family:monospace;font-size:10px;color:#a8a29e;min-width:50px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n.id.length>14?n.id.slice(0,13)+'…':n.id)}</span>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n.name)}</span>
      ${isSel?'<span style="color:#22c55e">✓</span>':''}
    </div>${isExp?ch.map(c=>nodeHTML(c,lv+1)).join(''):''}`;
  }
  const roots=struct.filter(n=>!n.parentId);
  list.innerHTML=roots.map(r=>nodeHTML(r,0)).join('');
  // Click sui toggle espande/collassa senza chiudere il dropdown
  list.querySelectorAll('.dtog').forEach(tog=>{
    tog.addEventListener('click',e=>{
      e.stopPropagation();
      const nid=tog.dataset.nid;
      if(dropExp.has(nid)) dropExp.delete(nid); else dropExp.add(nid);
      // Ricostruisci solo la lista
      list.innerHTML=roots.map(r=>nodeHTML(r,0)).join('');
      list.querySelectorAll('.dtog').forEach(t2=>{
        t2.addEventListener('click',e2=>{
          e2.stopPropagation();
          const nid2=t2.dataset.nid;
          if(dropExp.has(nid2)) dropExp.delete(nid2); else dropExp.add(nid2);
          list.innerHTML=roots.map(r=>nodeHTML(r,0)).join('');
        });
      });
    });
  });
}

function setMap(accountId,field,value) {
  set(s=>({mapping:{...s.mapping,[accountId]:{...(s.mapping[accountId]||{}),[field]:value}}}));
  document.getElementById('drop_'+'sel_'+accountId+'_'+field)?.remove();

  if(wrap) {
    const struct=(field==='civD'||field==='civC')?S.civile:(field==='corpD'||field==='corpC')?S.corporate:S.civilistic;

function clearMapping(which) {
  const labels = {civ:'Locale (Dare + Avere)', corp:'IFRS Corporate (Dare + Avere)', civ6:'VI Direttiva (Dare + Avere)'};
  const label  = labels[which] || which;
  const fields = which==='civ' ? ['civD','civC'] : which==='corp' ? ['corpD','corpC'] : ['civ6D','civ6C'];
  const count  = S.coa.filter(a => fields.some(f => S.mapping[a.id]?.[f])).length;
  if (count === 0) { alert('La mappatura ' + label + ' è già vuota.'); return; }
  if (!confirm(
    'Cancellare tutta la mappatura ' + label + '?\n\n' +
    count + ' conti verranno azzerati.\n\n' +
    'Questa operazione non è reversibile.'
  )) return;
  const newMap = {};
  S.coa.forEach(a => {
    const m = { ...(S.mapping[a.id] || {}) };
    fields.forEach(f => { m[f] = ''; });
    newMap[a.id] = m;
  });
  S.mapping = newMap;
  rMap();
  // feedback inline
  const _fb=document.createElement('div');
  _fb.className='alert ok';
  _fb.style.cssText='margin:8px 0;transition:opacity .5s';
  _fb.textContent='✓ Mappatura '+label+' azzerata — '+count+' conti resettati.';
  const _pg=document.getElementById('pg-map');
  if(_pg&&_pg.children[1]){_pg.insertBefore(_fb,_pg.children[1]);setTimeout(()=>{_fb.style.opacity='0';setTimeout(()=>_fb.remove(),500);},3000);}
}

function expMapCSV() {
  const rows=['ID Conto;Nome Conto;Locale Dare;Locale Avere;Corp Dare;Corp Avere;VI Dir Dare;VI Dir Avere'];
  S.coa.forEach(a=>{
    const m=S.mapping[a.id]||{};
    rows.push([a.id,a.name,m.civD||'',m.civC||'',m.corpD||'',m.corpC||'',m.civ6D||'',m.civ6C||''].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';'));
  });
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(rows.join('\n'));
  a.download='mapping_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
}

async function impMapCSV(inp) {
  const f=inp.files[0]; if(!f) return;
  try {
    let rows;
    if(f.name.toLowerCase().endsWith('.xlsx')) {
      const wb=await XLSX.read(await f.arrayBuffer());
      rows=wb.Sheets[wb.SheetNames[0]];
    } else {
      rows=parseCSV(await f.text());
    }
    const {mapping,coa}=parseMappingCSV(rows);
    const n=Object.keys(mapping).length;
    if(!n){alert('Nessun mapping trovato. Assicurati che le colonne siano: ID, Nome, Civ Dare, Civ Avere, Corp Dare, Corp Avere');inp.value='';return;}
    const existing=Object.keys(S.mapping).length;
    set(s=>({mapping:{...s.mapping,...mapping},coa:s.coa.length>0?s.coa:coa}));
    rMap();
    alert('✓ Importati '+n+' mapping'+(existing?' (aggiunti a '+existing+' esistenti)':'')+'. Totale: '+Object.keys(S.mapping).length+'.');
  } catch(ex){alert('Errore: '+ex.message);}
  inp.value='';
}

// rptView: 'ifrs-locale' | 'ifrs-corp' | 'civ-locale' | 'civ-dir6'
let rptView='ifrs-locale';
let rptMode='ytd';
let rptPeriods=[];

const rptCollapsed=new Set(); // IDs nodi collassati

// Risolve i parametri (struct, mapKey, bils) per il view corrente
function rptParams() {
  const v = rptView;
  if (v==='ifrs-locale') return {struct:S.civile,     mapKey:'civ',  bils:S.bilIFRS, label:'IFRS — Locale (Bil. Verifica)'};
  if (v==='ifrs-corp')   return {struct:S.corporate,  mapKey:'corp', bils:S.bilIFRS, label:'IFRS — Corporate (Reporting Package)'};
  if (v==='civ-locale')  return {struct:S.civile,     mapKey:'civ',  bils:S.bilCiv,  label:'Civilistico — Locale (Bil. Verifica)'};
                         return {struct:S.civilistic, mapKey:'civ6', bils:S.bilCiv,  label:'Civilistico — VI Direttiva CEE'};
}

// Ricostruisce l'intera pagina report (solo alla prima apertura o cambio view)

  const {bils} = rptParams();

  if(!rptPeriods.length&&allP.length) rptPeriods=[...allP];

  function grp(children) {
    return `<div style="display:flex;gap:2px;background:#e7e5e4;padding:2px;border-radius:7px">${children}</div>`;
  }
  function tb(label,active,onclick,title='') {

  }

  document.getElementById('pg-report').innerHTML=`
    <div id="rpt-outer">
      <div id="rpt-controls" style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          ${grp(
            tb('🔵 IFRS Locale',  rptView==='ifrs-locale',"setView('ifrs-locale')","IFRS — Bilancio di Verifica")+
            tb('🔷 IFRS Corp',    rptView==='ifrs-corp',  "setView('ifrs-corp')",  "IFRS — Reporting Package")+
            tb('🟢 Civ Locale',   rptView==='civ-locale', "setView('civ-locale')", "Civilistico — Bilancio di Verifica")+
            tb('📜 VI Direttiva', rptView==='civ-dir6',   "setView('civ-dir6')",   "Civilistico — VI Direttiva CEE")
          )}
          ${grp(
            tb('YTD',rptMode==='ytd',"setMode('ytd')","Saldo finale")+
            tb('PTD',rptMode==='ptd',"setMode('ptd')","Saldo finale − iniziale")
          )}
          ${allP.length?grp(
            allP.map(p=>tb(esc(p),rptPeriods.includes(p),`togglePeriod('${esc(p)}')`)).join('')+
            (allP.length>1?`<button class="btn btn-sm btn-off" onclick="selAllP()" title="Seleziona tutti">Tutti</button><button class="btn btn-sm btn-off" onclick="deselAllP()" title="Deseleziona tutti">Nessuno</button>`:'')
          ):''}
          ${grp(tb('≡ Conti',rptExpand,"toggleExpand()"))}
          ${grp(tb('📅 Quarter',rptGroupQ,"toggleGroupQ()","Aggrega per quarter fiscale (Q1=Apr-Giu, Q2=Lug-Set, Q3=Ott-Dic, Q4=Gen-Mar)"))}
        </div>
        <div style="display:flex;gap:5px">
          <button class="btn btn-sm btn-off no-print" onclick="expRptXLSX()">⬇ Excel</button>
